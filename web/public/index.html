<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSM — мнемосхема</title>
<style>
  :root {
    color-scheme: dark;
    --fg: light-dark(#1a1a1a, #e8e8e8);
    --muted: light-dark(#6b7280, #9ca3af);
    --bg: light-dark(#ffffff, #16181d);
    --card: light-dark(#f6f7f9, #1f2229);
    --border: light-dark(#d7dae0, #3a3f4a);
    --dev-fill: light-dark(#eef1f5, #262a33);
    --dev: light-dark(#16a34a, #4ade80);
    --frame-fill: light-dark(#f3f4f6, #20232b);
    --link: light-dark(#2563eb, #60a5fa);
    --holder: light-dark(#d97706, #fbbf24);
    --accent: light-dark(#7c3aed, #a78bfa);
    --grid: light-dark(rgba(0,0,0,.06), rgba(255,255,255,.06));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 400 13px/1.45 system-ui, sans-serif;
         display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin: 0 0 10px; }
  h1 { font-size: 14px; font-weight: 500; margin: 0; }
  #scene { flex: 1; min-height: 0; border-radius: 8px; overflow: auto; cursor: grab; }
  svg { display: block; touch-action: none; }
  body.editing g[data-dev] { cursor: grab; }
  body.editing g[data-frame] { cursor: grab; }
  #scene.panning { cursor: grabbing; }
  .gridbg { display: none; }
  body.editing .gridbg { display: block; }
  .tools { display: flex; align-items: center; gap: 6px; }
  #grid-step { width: 56px; height: 30px; padding: 0 6px; color: var(--fg);
               background: var(--card); border: 1px solid var(--border);
               border-radius: 6px; font: inherit; font-size: 12px; }
  #edit-btn, .zbtn { display: inline-flex; align-items: center; justify-content: center;
              width: 30px; height: 30px; padding: 0; color: var(--fg);
              background: var(--card); border: 1px solid var(--border);
              border-radius: 6px; cursor: pointer; }
  #edit-btn svg, .zbtn svg { width: 16px; height: 16px; }
  .zbtn { font: 500 16px/1 system-ui, sans-serif; }
  body.editing #edit-btn { border-color: var(--accent); color: var(--accent); }
  rect.dev { fill: var(--dev-fill); fill-opacity: .8; stroke: var(--dev); stroke-width: 1.5; }
  rect.frame-rect { fill: var(--frame-fill); stroke: var(--holder); stroke-width: 1.5; stroke-dasharray: 5 4; }
  polyline.link { stroke: var(--link); stroke-width: 2.5; fill: none; }
  circle.conn { fill: var(--link); }
  circle.hold { fill: none; stroke: var(--holder); stroke-width: 2; }
  text { fill: var(--fg); font-size: 13px; }
  text.sub, text.flabel { font-size: 11px; }
  text.dlabel { fill: var(--dev); }
  text.flabel { fill: var(--holder); }
  text.llabel { fill: var(--link); font-size: 11px; cursor: pointer;
                paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .hit { fill: transparent; stroke: none; }
  polyline.hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; }
  .el { cursor: pointer; }
  .xbtn { cursor: pointer; }
  .rsz { display: none; fill: var(--accent); stroke: var(--bg); stroke-width: 1; cursor: nwse-resize; }
  body.editing .rsz { display: block; }
  .lseg { stroke: transparent; stroke-width: 12; fill: none; pointer-events: stroke; }
  body.editing .lseg.h { cursor: row-resize; }
  body.editing .lseg.v { cursor: col-resize; }
  .xbtn rect { fill: var(--card); stroke: var(--dev); stroke-width: 1.5; }
  .xbtn line { stroke: var(--dev); stroke-width: 1.5; }
  svg.has-sel .el { opacity: .3; }
  svg.has-sel .el.sel { opacity: 1; }
  svg.has-sel text.llabel { opacity: .3; }
  svg.has-sel text.llabel.sel { opacity: 1; fill: var(--accent); }
  .el.sel rect.dev, .el.sel rect.frame-rect { stroke: var(--accent); stroke-width: 2.5; }
  .el.sel polyline.link { stroke: var(--accent); stroke-width: 3.5; }
  .el.sel circle.conn { fill: var(--accent); }
  .el.sel circle.hold { stroke: var(--accent); stroke-width: 3; }
  .el.sel text { fill: var(--accent); }
  #err { color: light-dark(#b91c1c, #f87171); }
</style>
</head>
<body>
<div class="topbar">
  <h1>DSM — мнемосхема системы (данные из PostgreSQL)</h1>
  <div class="tools">
    <input id="grid-step" type="number" min="5" max="200" step="5" value="20" title="Шаг сетки (единицы модели)" aria-label="Шаг сетки">
    <button class="zbtn" id="zoom-out" type="button" title="Уменьшить масштаб" aria-label="Уменьшить масштаб">−</button>
    <button class="zbtn" id="zoom-in" type="button" title="Увеличить масштаб" aria-label="Увеличить масштаб">+</button>
    <button id="edit-btn" type="button" title="Редактировать схему" aria-label="Редактировать схему">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
    </button>
  </div>
</div>
<div id="scene"></div>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var DEV_W = 120, DEV_H = 50, FRAME_HALF = 30, FRAME_PAD = 14;

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function txt(parent, x, y, str, cls) {
    var t = el('text', { x: x, y: y, 'text-anchor': 'middle' }, parent);
    if (cls) t.setAttribute('class', cls);
    t.textContent = str;
    return t;
  }
  function byId(rows) {
    var m = {};
    rows.forEach(function (r) { m[r.id] = r; });
    return m;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  // Внутреннее содержимое составного Device показывается только во второй
  // половине раскрытия: иначе полноразмерные подписи и объекты налезают
  // на ещё маленький контейнер при сворачивании/раскрытии.
  function fadeInner(t) { return t <= 0.5 ? 0 : (2 * t - 1) * (2 * t - 1); }

  // Ортогональная перестройка трассы: концы могли сместиться (проекция портов
  // на границу свёрнутого Device), ориентации сегментов берутся из хранимой трассы.
  // ex0/exL — ось отхода от края Device ('h'/'v'): линк сначала отходит прямым
  // участком по нормали к грани, изгибы только после отхода.
  function orthoRoute(pts, orig, ex0, exL) {
    var n = pts.length;
    if (n < 2) return pts.slice();
    var orient = [];
    for (var i = 0; i < n - 1; i++) {
      orient.push(Math.abs(orig[i + 1].x - orig[i].x) >= Math.abs(orig[i + 1].y - orig[i].y));
    }
    // Угол перегиба у края Device едет за концом трассы по нормали к грани,
    // иначе после сдвига девайса вертикаль уезжает, а угол остаётся на месте.
    if (n > 2) {
      if (ex0) { if (ex0 === 'h') pts[1].y = pts[0].y; else pts[1].x = pts[0].x; }
      if (exL) { if (exL === 'h') pts[n - 2].y = pts[n - 1].y; else pts[n - 2].x = pts[n - 1].x; }
    }
    if (ex0) orient[0] = ex0 === 'h';
    if (exL) orient[n - 2] = exL === 'h';
    var pp = pts;
    if (ex0 || exL) {
      var STUB = 25, a = pts[0], b = pts[n - 1];
      var h0 = ex0 ? ex0 === 'h' : orient[0];
      var hL = exL ? exL === 'h' : orient[n - 2];
      // Отход не длиннее примыкающего сегмента, иначе на коротких линках
      // отходы двух концов перекрываются и дают возвратный хвост.
      var half = n === 2 ? Math.sqrt((b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y)) / 2 : Infinity;
      var S0 = Math.min(STUB, half, Math.abs(h0 ? pts[1].x - a.x : pts[1].y - a.y));
      var SL = Math.min(STUB, half, Math.abs(hL ? pts[n - 2].x - b.x : pts[n - 2].y - b.y));
      // Параллельные отходы на косом коротком линке: сумма отходов не длиннее
      // расстояния между концами вдоль их оси, иначе средний сегмент идёт назад.
      if (n === 2 && h0 === hL) {
        var span = Math.abs(h0 ? b.x - a.x : b.y - a.y) / 2;
        S0 = Math.min(S0, span); SL = Math.min(SL, span);
      }
      var A = { x: a.x + (h0 ? (b.x >= a.x ? 1 : -1) * S0 : 0), y: a.y + (h0 ? 0 : (b.y >= a.y ? 1 : -1) * S0) };
      var B = { x: b.x + (hL ? (a.x >= b.x ? 1 : -1) * SL : 0), y: b.y + (hL ? 0 : (a.y >= b.y ? 1 : -1) * SL) };
      pp = [a, A].concat(pts.slice(1, n - 1), [B, b]);
      orient = [h0].concat(orient, [hL]);
    }
    var m = pp.length;
    var out = [pp[0]];
    for (var i = 1; i < m - 1; i++) {
      out.push(orient[i - 1] ? { x: pp[i].x, y: out[i - 1].y } : { x: out[i - 1].x, y: pp[i].y });
    }
    var a2 = out[out.length - 1], b2 = pp[m - 1];
    if (a2.x !== b2.x && a2.y !== b2.y) {
      if (m === 2) {
        if (orient[0]) {
          var mx = (a2.x + b2.x) / 2;
          out.push({ x: mx, y: a2.y }, { x: mx, y: b2.y });
        } else {
          var my = (a2.y + b2.y) / 2;
          out.push({ x: a2.x, y: my }, { x: b2.x, y: my });
        }
      } else if (orient[m - 2]) out.push({ x: a2.x, y: b2.y });
      else out.push({ x: b2.x, y: a2.y });
    }
    out.push(b2);
    return out.filter(function (p, i) { return i === 0 || p.x !== out[i - 1].x || p.y !== out[i - 1].y; });
  }

  var model = null, anim = {}, raf = null, deselect = function () {};
  var drag = null, dragMoved = false, editMode = false;
  // Фиксированный масштаб: 1 единица модели = zoom px; авто-подгонки под
  // контейнер нет, выход за край даёт прокрутку, зум — только кнопками.
  var zoom = 1;
  var gridStep = 20;
  var segRoutes = {};
  // Мировое поле фиксировано при загрузке: содержимое плюс большие пустые
  // поля — холст панорамируется и не переякоривается при перерисовке.
  var world = null, centered = false;

  function setZoom(z, px, py) {
    var nz = Math.min(4, Math.max(0.25, z));
    var scene = document.getElementById('scene');
    if (px == null) px = scene.clientWidth / 2;
    if (py == null) py = scene.clientHeight / 2;
    var cx = scene.scrollLeft + px;
    var cy = scene.scrollTop + py;
    var k = nz / zoom;
    zoom = nz;
    if (model) render();
    scene.scrollLeft = cx * k - px;
    scene.scrollTop = cy * k - py;
  }
  document.getElementById('zoom-in').addEventListener('click', function () { setZoom(zoom * 1.25); });
  document.getElementById('zoom-out').addEventListener('click', function () { setZoom(zoom / 1.25); });
  // Ctrl + колесо: зум в точку курсора и из неё; без Ctrl — обычная прокрутка.
  document.getElementById('scene').addEventListener('wheel', function (e) {
    if (!e.ctrlKey || !model) return;
    e.preventDefault();
    var r = this.getBoundingClientRect();
    setZoom(zoom * Math.exp(-e.deltaY * 0.002), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  document.getElementById('grid-step').addEventListener('change', function () {
    var v = Number(this.value);
    if (!isFinite(v)) return;
    gridStep = Math.min(200, Math.max(5, v));
    this.value = gridStep;
    if (model) render();
  });

  document.getElementById('edit-btn').addEventListener('click', function () {
    editMode = !editMode;
    document.body.classList.toggle('editing', editMode);
    var t = editMode ? 'Закончить редактирование' : 'Редактировать схему';
    this.title = t;
    this.setAttribute('aria-label', t);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') deselect();
  });

  // Перемещение Device: вместе с ним едут его порты, крепления и внутренняя
  // схема составного Device; парные коннекторы линков следуют за контактом.
  function moveLink(l, dx, dy, moved) {
    model.linkPoints.forEach(function (p) { if (p.link_id === l.id) { p.x += dx; p.y += dy; } });
    model.connectors.forEach(function (c) { if (c.link_id === l.id) { c.x += dx; c.y += dy; if (moved) moved.push(c.id); } });
    model.holders.forEach(function (h) { if (h.link_id === l.id) { h.x += dx; h.y += dy; } });
    model.links.forEach(function (k) { if (k.parent_link_id === l.id) moveLink(k, dx, dy, moved); });
  }
  function nearestOnSeg(p, a, b) {
    var vx = b.x - a.x, vy = b.y - a.y;
    var L = vx * vx + vy * vy;
    var t = L ? ((p.x - a.x) * vx + (p.y - a.y) * vy) / L : 0;
    t = Math.max(0, Math.min(1, t));
    return { x: a.x + vx * t, y: a.y + vy * t };
  }
  function distSeg(p, a, b) {
    var q = nearestOnSeg(p, a, b);
    return Math.sqrt((p.x - q.x) * (p.x - q.x) + (p.y - q.y) * (p.y - q.y));
  }
  // Крепления линка остаются на трассе после её перестройки.
  function devSizeM(d) {
    var comp = model.devices.some(function (o) { return o.parent_device_id === d.id; });
    if (!comp) return { w: d.w || DEV_W, h: d.h || DEV_H };
    var t = anim[d.id] || 0;
    return { w: lerp(DEV_W, d.w || DEV_W, t), h: lerp(DEV_H, d.h || DEV_H, t) };
  }
  function exitAtM(pt, fb) {
    var c = null;
    model.connectors.forEach(function (cc) { if (cc.device_id && cc.x === pt.x && cc.y === pt.y) c = cc; });
    if (!c) return fb ? 'h' : 'v';
    var d = byId(model.devices)[c.device_id], s = devSizeM(d);
    return Math.abs(pt.x - d.x) / (s.w / 2) >= Math.abs(pt.y - d.y) / (s.h / 2) ? 'h' : 'v';
  }
  function routeOf(arr) {
    if (arr.length < 2) return arr;
    var h0 = Math.abs(arr[1].x - arr[0].x) >= Math.abs(arr[1].y - arr[0].y);
    var hL = Math.abs(arr[arr.length - 1].x - arr[arr.length - 2].x) >= Math.abs(arr[arr.length - 1].y - arr[arr.length - 2].y);
    return orthoRoute(arr, arr, exitAtM(arr[0], h0), exitAtM(arr[arr.length - 1], hL));
  }
  function snapLinkHolders(lid) {
    var m = model, lines = {};
    m.linkPoints.forEach(function (p) {
      if (p.link_id === lid) (lines[p.line_no] = lines[p.line_no] || []).push(p);
    });
    var routes = Object.keys(lines).map(function (k) {
      return routeOf(lines[k].sort(function (a, b) { return a.ord - b.ord; })
        .map(function (p) { return { x: p.x, y: p.y }; }));
    });
    m.holders.forEach(function (h) {
      if (h.link_id !== lid || h.x == null) return;
      var best = null;
      routes.forEach(function (r) {
        for (var i = 1; i < r.length; i++) {
          var q = nearestOnSeg(h, r[i - 1], r[i]);
          var d = (q.x - h.x) * (q.x - h.x) + (q.y - h.y) * (q.y - h.y);
          if (!best || d < best.d) best = { d: d, q: q };
        }
      });
      if (best) { h.x = best.q.x; h.y = best.q.y; }
    });
  }
  function moveDeviceCore(id, dx, dy, moved) {
    var m = model;
    function dev(d) {
      d.x += dx; d.y += dy;
      m.connectors.forEach(function (c) { if (c.device_id === d.id) { c.x += dx; c.y += dy; moved.push(c.id); } });
      m.holders.forEach(function (h) { if (h.device_id === d.id) { h.x += dx; h.y += dy; } });
      m.devices.forEach(function (o) { if (o.parent_device_id === d.id) dev(o); });
      m.links.forEach(function (l) { if (l.parent_device_id === d.id) moveLink(l, dx, dy, moved); });
      m.frames.forEach(function (f) {
        if (f.parent_device_id !== d.id) return;
        f.x += dx; f.y += dy;
        if (f.base_y != null) f.base_y += dy;
        m.holders.forEach(function (h) { if (h.frame_id === f.id) { h.x += dx; h.y += dy; } });
      });
    }
    dev(byId(m.devices)[id]);
  }
  // Контакт слитно: коннектор линка, парный смещённому коннектору Device,
  // едет следом вместе с концом трассы своего линка.
  function cascadeContacts(moved, deltas, touched) {
    var m = model, byIdC = byId(m.connectors);
    for (var i = 0; i < moved.length; i++) {
      var dd = deltas[moved[i]] || { dx: 0, dy: 0 };
      m.connections.forEach(function (p) {
        var other = p.connector_a_id === moved[i] ? p.connector_b_id :
                    p.connector_b_id === moved[i] ? p.connector_a_id : null;
        if (other == null || moved.indexOf(other) >= 0) return;
        var c = byIdC[other];
        if (!c.link_id) return;
        var ox = c.x, oy = c.y;
        var oldPts = m.linkPoints.filter(function (pt) { return pt.link_id === c.link_id; })
          .map(function (pt) { return { line_no: pt.line_no, ord: pt.ord, x: pt.x, y: pt.y }; });
        c.x += dd.dx; c.y += dd.dy;
        // конец трассы и соседняя вершина (угол у грани / конец защитного
        // отхода) едут вместе с коннектором, иначе отход отрывается от контакта
        var lines = {};
        m.linkPoints.forEach(function (pt) { if (pt.link_id === c.link_id) (lines[pt.line_no] = lines[pt.line_no] || []).push(pt); });
        Object.keys(lines).forEach(function (k) {
          var arr = lines[k].sort(function (a, b) { return a.ord - b.ord; });
          var n = arr.length;
          if (n && arr[0].x === ox && arr[0].y === oy) {
            arr[0].x += dd.dx; arr[0].y += dd.dy;
            if (n > 2) { arr[1].x += dd.dx; arr[1].y += dd.dy; }
          }
          if (n && arr[n - 1].x === ox && arr[n - 1].y === oy) {
            arr[n - 1].x += dd.dx; arr[n - 1].y += dd.dy;
            if (n > 2) { arr[n - 2].x += dd.dx; arr[n - 2].y += dd.dy; }
          }
        });
        // Крепление на сегменте трассы, примыкающем к смещённому концу, едет следом.
        var ls = {};
        oldPts.forEach(function (q) { (ls[q.line_no] = ls[q.line_no] || []).push(q); });
        var oldRoutes = Object.keys(ls).map(function (k) {
          return routeOf(ls[k].sort(function (a, b) { return a.ord - b.ord; })
            .map(function (q) { return { x: q.x, y: q.y }; }));
        });
        m.holders.forEach(function (h) {
          if (h.link_id !== c.link_id || h.x == null) return;
          oldRoutes.forEach(function (r) {
            // Отход добавляет промежуточную вершину: сегмент крепления может
            // заканчиваться не в коннекторе, а на одной линии с отходом.
            var horiz = r[r.length - 2].y === r[r.length - 1].y;
            for (var j = 1; j < r.length; j++) {
              var a = r[j - 1], b = r[j];
              var onExitLine = horiz ? (a.y === oy && b.y === oy) : (a.x === ox && b.x === ox);
              if (!onExitLine) continue;
              if (distSeg(h, a, b) < 0.5) { h.x += dd.dx; h.y += dd.dy; }
            }
          });
        });
        touched[c.link_id] = true;
        deltas[other] = dd;
        moved.push(other);
      });
    }
  }
  function finishMove(touched) {
    Object.keys(touched).forEach(function (lid) { snapLinkHolders(+lid); });
    render();
  }
  function moveDevice(id, dx, dy) {
    var moved = [], touched = {}, deltas = {};
    moveDeviceCore(id, dx, dy, moved);
    moved.forEach(function (cid) { deltas[cid] = { dx: dx, dy: dy }; });
    cascadeContacts(moved, deltas, touched);
    finishMove(touched);
  }
  // Перемещение Frame: вместе с ним едет всё закреплённое на нём —
  // Device и Link через пары Holder↔Holder, со своим каскадом контактов.
  function moveFrame(id, dx, dy) {
    var m = model, moved = [], touched = {}, seen = {};
    var f = byId(m.frames)[id];
    f.x += dx; f.y += dy;
    if (f.base_y != null) f.base_y += dy;
    var fh = {};
    m.holders.forEach(function (h) { if (h.frame_id === id) { h.x += dx; h.y += dy; fh[h.id] = true; } });
    m.bindings.forEach(function (b) {
      var mine = fh[b.holder_a_id] ? b.holder_a_id : fh[b.holder_b_id] ? b.holder_b_id : null;
      if (mine == null) return;
      var h = byId(m.holders)[mine === b.holder_a_id ? b.holder_b_id : b.holder_a_id];
      var key = (h.device_id ? 'd' : 'l') + (h.device_id || h.link_id);
      if (seen[key]) return;
      seen[key] = true;
      if (h.device_id) moveDeviceCore(h.device_id, dx, dy, moved);
      else { moveLink(byId(m.links)[h.link_id], dx, dy, moved); touched[h.link_id] = true; }
    });
    cascadeContacts(moved, (function () {
      var dmap = {};
      moved.forEach(function (cid) { dmap[cid] = { dx: dx, dy: dy }; });
      return dmap;
    })(), touched);
    finishMove(touched);
  }

  // Ресайз за ПНУ: якорь — ЛПУ, габарит пишется в d.w/d.h (память сессии);
  // порты и крепления масштабируются пропорционально от старого центра.
  function startResize(id, cx, cy) {
    var d = byId(model.devices)[id];
    var old = { w: d.w || DEV_W, h: d.h || DEV_H };
    var oldC = { x: d.x, y: d.y };
    return {
      kind: 'resize', id: id, cx: cx, cy: cy,
      tl: { x: d.x - old.w / 2, y: d.y - old.h / 2 }, old: old,
      ports: model.connectors.filter(function (c) { return c.device_id === id; })
        .map(function (c) { return { id: c.id, ox: c.x - oldC.x, oy: c.y - oldC.y }; }),
      holds: model.holders.filter(function (h) { return h.device_id === id; })
        .map(function (h) { return { id: h.id, ox: h.x - oldC.x, oy: h.y - oldC.y }; })
    };
  }
  function resizeTo(drag, wx, wy) {
    var d = byId(model.devices)[drag.id];
    var nw = Math.max(40, Math.round(wx / gridStep) * gridStep - drag.tl.x);
    var nh = Math.max(30, Math.round(wy / gridStep) * gridStep - drag.tl.y);
    var sx = nw / drag.old.w, sy = nh / drag.old.h;
    var nc = { x: drag.tl.x + nw / 2, y: drag.tl.y + nh / 2 };
    d.w = nw; d.h = nh; d.x = nc.x; d.y = nc.y;
    var moved = [], deltas = {}, touched = {};
    var byIdC = byId(model.connectors), byIdH = byId(model.holders);
    drag.ports.forEach(function (p) {
      var c = byIdC[p.id], nx = nc.x + p.ox * sx, ny = nc.y + p.oy * sy;
      deltas[p.id] = { dx: nx - c.x, dy: ny - c.y };
      c.x = nx; c.y = ny; moved.push(p.id);
    });
    drag.holds.forEach(function (p) {
      var h = byIdH[p.id]; h.x = nc.x + p.ox * sx; h.y = nc.y + p.oy * sy;
    });
    cascadeContacts(moved, deltas, touched);
    finishMove(touched);
  }

  // Сдвиг сегмента трассы перпендикулярно его ориентации: горизонтальный —
  // по вертикали, вертикальный — по горизонтали. Концы-разъёмы (первый и
  // последний stored узел) не двигаются; защитный перпендикулярный отход
  // у разъёма всегда восстанавливает orthoRoute. Углы остаются прямыми.
  function segJ(pts, horiz, span) {
    var ax = horiz ? 'x' : 'y';
    for (var k = 1; k < pts.length - 2; k++) {
      var P = pts[k], Q = pts[k + 1];
      if ((horiz ? P.y === Q.y : P.x === Q.x) &&
          Math.min(P[ax], Q[ax]) === span[0] && Math.max(P[ax], Q[ax]) === span[1]) return k;
    }
    return -1;
  }
  function moveSeg(drag, delta) {
    var pts = segRoutes[drag.link + ':' + drag.line];
    if (!pts) return;
    var j = segJ(pts, drag.horiz, drag.span);
    if (j < 0) return;
    var key = drag.horiz ? 'y' : 'x';
    var last = pts.length - 1;
    var touchA = (j === 1), touchB = (j + 1 === last - 1);
    // Отход на той же оси, что и сегмент, поперёк не сдвинуть: он обязан
    // выходить из разъёма перпендикулярно грани — сегмент остановлен.
    if (touchA && (pts[1].y === pts[0].y) === drag.horiz) return;
    if (touchB && (pts[last].y === pts[last - 1].y) === drag.horiz) return;
    var nv = Math.round((drag.base0 + delta) / gridStep) * gridStep;
    // Дальше соседнего угла перегиба сегмент не едет: иначе примыкающий
    // сегмент разворачивается назад и даёт излом. Стык с отходом скользит
    // по оси отхода, защитный кусок не короче STUB.
    var v = pts[j][key], lo = -Infinity, hi = Infinity, STUB = 25;
    function side(c, s) { if (s === 'lo') lo = Math.max(lo, c); else hi = Math.min(hi, c); }
    function sym(c) { if (c < v) side(c, 'lo'); else if (c > v) side(c, 'hi'); else { side(c, 'lo'); side(c, 'hi'); } }
    if (touchA) side(pts[0][key] + (pts[1][key] >= pts[0][key] ? STUB : -STUB), pts[1][key] >= pts[0][key] ? 'lo' : 'hi');
    else if (j - 1 >= 0) sym(pts[j - 1][key]);
    if (touchB) side(pts[last][key] + (pts[last - 1][key] <= pts[last][key] ? -STUB : STUB), pts[last - 1][key] <= pts[last][key] ? 'hi' : 'lo');
    else if (j + 2 <= last) sym(pts[j + 2][key]);
    nv = Math.max(lo, Math.min(hi, nv));
    if (nv === v) return;
    var np = pts.map(function (p) { return { x: p.x, y: p.y }; });
    np[touchA ? 1 : j][key] = nv;
    np[touchB ? last - 1 : j + 1][key] = nv;
    // храним все вершины отрисованной трассы: концы защитных отходов остаются
    // на нормали грани, иначе orthoRoute вернёт их на ось и сотрёт изгиб
    var stored = np;
    model.linkPoints = model.linkPoints.filter(function (p) {
      return !(p.link_id === drag.link && p.line_no === drag.line);
    });
    stored.forEach(function (p, idx) {
      model.linkPoints.push({ link_id: drag.link, line_no: drag.line, ord: idx + 1, x: p.x, y: p.y });
    });
    snapLinkHolders(drag.link);
    render();
  }

  document.getElementById('scene').addEventListener('pointerdown', function (e) {
    if (!model || e.target.closest('.xbtn')) return;
    var rz = editMode && e.target.closest('.rsz');
    if (rz) {
      drag = startResize(+rz.getAttribute('data-rsz'), e.clientX, e.clientY);
      dragMoved = false;
      e.preventDefault();
      return;
    }
    var ls = editMode && e.target.closest('.lseg');
    if (ls) {
      // контейнер составного Device рисуется под трассами: клик по его телу
      // двигает контейнер, а не сегмент линка, лежащий поверх
      var sv0 = document.querySelector('#scene svg');
      var cm0 = sv0.getScreenCTM();
      var wx = (e.clientX - cm0.e) / cm0.a, wy = (e.clientY - cm0.f) / cm0.d;
      var cid = null;
      model.devices.forEach(function (d) {
        if (d.x == null || !isComp(d)) return;
        var s = devSizeM(d);
        if (wx >= d.x - s.w / 2 && wx <= d.x + s.w / 2 && wy >= d.y - s.h / 2 && wy <= d.y + s.h / 2) cid = d.id;
      });
      if (cid != null) {
        drag = { kind: 'dev', id: cid, cx: e.clientX, cy: e.clientY };
        dragMoved = false;
        e.preventDefault();
        return;
      }
      var lk = +ls.getAttribute('data-link'), lno = +ls.getAttribute('data-line');
      var hz = ls.getAttribute('data-h') === '1';
      var sp = ls.getAttribute('data-span').split(',').map(Number);
      var rp = segRoutes[lk + ':' + lno] || [];
      var jj = segJ(rp, hz, sp);
      drag = { kind: 'seg', link: lk, line: lno, horiz: hz, span: sp,
        base0: jj >= 0 ? rp[jj][hz ? 'y' : 'x'] : 0, cx: e.clientX, cy: e.clientY };
      dragMoved = false;
      e.preventDefault();
      return;
    }
    var g = editMode && e.target.closest('g[data-dev]');
    var fg = !g && editMode && e.target.closest('g[data-frame]');
    // захват за кружок порта/крепления двигает его владельца, а не игнорируется
    var pg = !g && !fg && editMode && e.target.closest('g[data-pdev]');
    var pf = !g && !fg && !pg && editMode && e.target.closest('g[data-pframe]');
    if (g || pg) {
      drag = { kind: 'dev', id: +(g || pg).getAttribute(g ? 'data-dev' : 'data-pdev'), cx: e.clientX, cy: e.clientY };
    } else if (fg || pf) {
      drag = { kind: 'frame', id: +(fg || pf).getAttribute(fg ? 'data-frame' : 'data-pframe'), cx: e.clientX, cy: e.clientY };
    } else if (!e.target.closest('.el')) {
      drag = { kind: 'pan', cx: e.clientX, cy: e.clientY };
    } else return;
    dragMoved = false;
    e.preventDefault();
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!dragMoved && Math.abs(e.clientX - drag.cx) < 3 && Math.abs(e.clientY - drag.cy) < 3) return;
    dragMoved = true;
    if (drag.kind === 'pan') {
      var sc = document.getElementById('scene');
      sc.classList.add('panning');
      sc.scrollLeft -= e.clientX - drag.cx;
      sc.scrollTop -= e.clientY - drag.cy;
      drag.cx = e.clientX; drag.cy = e.clientY;
      return;
    }
    if (drag.kind === 'resize') {
      var sv = document.querySelector('#scene svg');
      var cm = sv.getScreenCTM();
      resizeTo(drag, (e.clientX - cm.e) / cm.a, (e.clientY - cm.f) / cm.d);
      drag.cx = e.clientX; drag.cy = e.clientY;
      return;
    }
    if (drag.kind === 'seg') {
      var sv2 = document.querySelector('#scene svg');
      var cm2 = sv2.getScreenCTM();
      var d = drag.horiz ? (e.clientY - drag.cy) / cm2.d : (e.clientX - drag.cx) / cm2.a;
      moveSeg(drag, d);
      return;
    }
    var svg = document.querySelector('#scene svg');
    // Масштаб фиксирован (zoom), поэтому px → единицы модели делением на ctm.a/d.
    var ctm = svg.getScreenCTM();
    var dx = (e.clientX - drag.cx) / ctm.a, dy = (e.clientY - drag.cy) / ctm.d;
    drag.cx = e.clientX; drag.cy = e.clientY;
    // Магнит к сетке: у Device снапится левый верхний угол, у Frame — вершина.
    if (drag.kind === 'frame') {
      var f = byId(model.frames)[drag.id];
      dx = Math.round((f.x + dx) / gridStep) * gridStep - f.x;
      dy = Math.round((f.y + dy) / gridStep) * gridStep - f.y;
      moveFrame(drag.id, dx, dy);
    } else {
      var d = byId(model.devices)[drag.id], s = devSizeM(d);
      dx = Math.round((d.x + dx - s.w / 2) / gridStep) * gridStep + s.w / 2 - d.x;
      dy = Math.round((d.y + dy - s.h / 2) / gridStep) * gridStep + s.h / 2 - d.y;
      moveDevice(drag.id, dx, dy);
    }
  });
  document.addEventListener('pointerup', function () {
    drag = null;
    document.getElementById('scene').classList.remove('panning');
  });
  document.getElementById('scene').addEventListener('click', function (e) {
    if (dragMoved) { e.stopPropagation(); dragMoved = false; }
  }, true);

  fetch('/api/model').then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (m) { model = m; render(); }).catch(function (e) {
    var scene = document.getElementById('scene');
    scene.innerHTML = '<p id="err"></p>';
    document.getElementById('err').textContent = 'Ошибка загрузки модели: ' + String(e.message || e);
  });

  function toggle(id) {
    var from = anim[id] || 0, to = from < 0.5 ? 1 : 0, t0 = performance.now();
    if (raf) cancelAnimationFrame(raf);
    function step(now) {
      var p = Math.min(1, (now - t0) / 350);
      var e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      anim[id] = from + (to - from) * e;
      render();
      if (p < 1) raf = requestAnimationFrame(step);
      else { anim[id] = to; raf = null; render(); }
    }
    raf = requestAnimationFrame(step);
  }

  // Расчёт геометрии сцены при заданной степени раскрытия составных Device (0..1).
  function buildLayout(tMap) {
    var m = model;
    var devices = byId(m.devices), links = byId(m.links), frames = byId(m.frames),
        resources = byId(m.resources), connectors = byId(m.connectors), holders = byId(m.holders);
    var compIds = {};
    m.devices.forEach(function (d) {
      if (m.devices.some(function (o) { return o.parent_device_id === d.id; })) compIds[d.id] = true;
    });
    function tOf(id) { return tMap[id] || 0; }
    function isComp(d) { return !!compIds[d.id]; }
    function devSize(d) {
      if (!isComp(d)) return { w: d.w || DEV_W, h: d.h || DEV_H, t: 0 };
      var t = tOf(d.id);
      return { w: lerp(DEV_W, d.w || DEV_W, t), h: lerp(DEV_H, d.h || DEV_H, t), t: t };
    }
    function collapsedPort(d, c) {
      var dx = c.x - d.x, dy = c.y - d.y;
      if (Math.abs(dx) >= Math.abs(dy)) return { x: d.x + (dx < 0 ? -1 : 1) * DEV_W / 2, y: d.y };
      return { x: d.x, y: d.y + (dy < 0 ? -1 : 1) * DEV_H / 2 };
    }
    function connPos(c) {
      var o = c.device_id ? devices[c.device_id] : null;
      if (o && isComp(o)) {
        var cp = collapsedPort(o, c), t = tOf(o.id);
        return { x: lerp(cp.x, c.x, t), y: lerp(cp.y, c.y, t) };
      }
      var b = boundary[c.id];
      if (b) return connPos(b.bc);
      return { x: c.x, y: c.y };
    }
    function holdPos(h) {
      // Крепление Frame едет за объектом, который он держит: позиция выводится
      // из парного Holder (Device/Link), а не хранится независимо.
      if (h.frame_id) {
        var pr = null;
        for (var i = 0; i < m.bindings.length; i++) {
          var p = m.bindings[i];
          if (p.holder_a_id === h.id) { pr = holders[p.holder_b_id]; break; }
          if (p.holder_b_id === h.id) { pr = holders[p.holder_a_id]; break; }
        }
        if (pr && !pr.frame_id) return holdPos(pr);
        return { x: h.x, y: h.y };
      }
      var o = h.device_id ? devices[h.device_id] : null;
      if (o && isComp(o)) {
        var t = tOf(o.id);
        var cx = Math.max(o.x - DEV_W / 2, Math.min(o.x + DEV_W / 2, h.x));
        return { x: lerp(cx, h.x, t), y: lerp(o.y + DEV_H / 2, h.y, t) };
      }
      return { x: h.x, y: h.y };
    }

    // Граничные коннекторы составных Device и их связи с внешними линками.
    var boundary = {}, bcHasInner = {};
    Object.keys(compIds).forEach(function (cid) {
      var cd = devices[cid];
      m.connectors.filter(function (c) { return c.device_id === cd.id; }).forEach(function (bc) {
        var partners = m.connections.filter(function (p) {
          return p.connector_a_id === bc.id || p.connector_b_id === bc.id;
        }).map(function (p) {
          return connectors[p.connector_a_id === bc.id ? p.connector_b_id : p.connector_a_id];
        });
        var inner = partners.filter(function (p) {
          return p.device_id && devices[p.device_id].parent_device_id === cd.id;
        });
        bcHasInner[bc.id] = inner.length > 0;
        partners.filter(function (p) { return p.link_id; }).forEach(function (ec) {
          boundary[ec.id] = { bc: bc, inner: inner[0] || null, cd: cd };
        });
      });
    });

    function connOpacity(c) {
      if (c.link_id) {
        var l = links[c.link_id];
        if (l.parent_device_id) return fadeInner(tOf(l.parent_device_id));
        var b = boundary[c.id];
        if (b && b.inner) return 1 - tOf(b.cd.id);
        return 1;
      }
      var o = devices[c.device_id];
      if (o.parent_device_id) return fadeInner(tOf(o.parent_device_id));
      if (isComp(o) && bcHasInner[c.id]) return 1 - tOf(o.id);
      return 1;
    }
    function holdOpacity(h) {
      if (h.device_id) { var o = devices[h.device_id]; return o.parent_device_id ? fadeInner(tOf(o.parent_device_id)) : 1; }
      if (h.link_id) { var l = links[h.link_id]; return l.parent_device_id ? fadeInner(tOf(l.parent_device_id)) : 1; }
      var f = frames[h.frame_id];
      return f.parent_device_id ? fadeInner(tOf(f.parent_device_id)) : 1;
    }
    function frameGeom(f) {
      var hs = m.holders.filter(function (h) { return h.frame_id === f.id && h.x != null; });
      var x1, x2, y1, y2;
      if (hs.length) {
        var ps = hs.map(holdPos);
        x1 = Math.min.apply(null, ps.map(function (p) { return p.x; })) - FRAME_PAD;
        x2 = Math.max.apply(null, ps.map(function (p) { return p.x; })) + FRAME_PAD;
        y1 = Math.min.apply(null, ps.map(function (p) { return p.y; })) - FRAME_PAD;
        y2 = Math.max.apply(null, ps.map(function (p) { return p.y; })) + FRAME_PAD;
      } else {
        x1 = f.x - FRAME_HALF; x2 = f.x + FRAME_HALF;
        y1 = f.y; y2 = f.base_y != null ? f.base_y : f.y + 2 * FRAME_HALF;
      }
      // Подпись Frame — внутри, у нижней границы: прямоугольник охватывает
      // холдеры и строку подписи.
      var fw = f.name.length * 6, cx = (x1 + x2) / 2;
      y2 += 16;
      x1 = Math.min(x1, cx - fw / 2 - 6);
      x2 = Math.max(x2, cx + fw / 2 + 6);
      return { x1: x1, x2: x2, y1: y1, y2: y2, labelY: y2 - 5 };
    }
    // Ось отхода от края Device: нормаль к грани, на которой стоит коннектор.
    function exitAt(pt, fb) {
      var c = null;
      m.connectors.forEach(function (cc) { if (cc.device_id && cc.x === pt.x && cc.y === pt.y) c = cc; });
      if (!c) return fb ? 'h' : 'v';
      var d = devices[c.device_id], s = devSize(d);
      return Math.abs(pt.x - d.x) / (s.w / 2) >= Math.abs(pt.y - d.y) / (s.h / 2) ? 'h' : 'v';
    }
    function ownerName(c) {
      if (c.device_id) return devices[c.device_id].name;
      if (c.link_id) return links[c.link_id].name;
      if (c.frame_id) return frames[c.frame_id].name;
      return '—';
    }
    function compDesc(d) {
      var nd = m.devices.filter(function (o) { return o.parent_device_id === d.id; }).length;
      var nl = m.links.filter(function (o) { return o.parent_device_id === d.id; }).length;
      var nf = m.frames.filter(function (o) { return o.parent_device_id === d.id; }).length;
      return 'Составной Device: внутренняя схема — устройств: ' + nd + ', линков: ' + nl + ', фреймов: ' + nf + '.';
    }

    var L = { containers: [], frames: [], links: [], devices: [], ports: [], labels: [], buttons: [] };

    m.devices.forEach(function (d) {
      if (d.x == null || !isComp(d)) return;
      var s = devSize(d);
      L.containers.push({
        d: d, x: d.x - s.w / 2, y: d.y - s.h / 2, w: s.w, h: s.h, t: s.t,
        nameY: lerp(d.y - 3, d.y - s.h / 2 + 18, s.t),
        subY: lerp(d.y + 14, d.y - s.h / 2 + 33, s.t),
        desc: compDesc(d)
      });
      L.buttons.push({ id: d.id, x: d.x + s.w / 2 - 14, y: d.y - s.h / 2 + 14, t: s.t });
    });

    m.frames.forEach(function (f) {
      if (f.x == null) return;
      var op = f.parent_device_id ? fadeInner(tOf(f.parent_device_id)) : 1;
      if (op < 0.01) return;
      var gm = frameGeom(f);
      var hs = m.holders.filter(function (h) { return h.frame_id === f.id; });
      L.frames.push({
        f: f, x1: gm.x1, y1: gm.y1, x2: gm.x2, y2: gm.y2, labelY: gm.labelY, opacity: op,
        inner: !!f.parent_device_id,
        desc: 'Несущая конструкция: ресурс не передаёт, коннекторов нет. Креплений (Holder): ' + hs.length + '.'
      });
    });

    m.links.forEach(function (l) {
      var pts = m.linkPoints.filter(function (p) { return p.link_id === l.id; });
      if (!pts.length) return;
      var op = l.parent_device_id ? fadeInner(tOf(l.parent_device_id)) : 1;
      if (op < 0.01) return;
      var adj = {};
      m.connectors.forEach(function (c) {
        if (c.link_id === l.id && boundary[c.id]) {
          var b = boundary[c.id], P = connPos(b.bc), t = tOf(b.cd.id);
          adj[c.x + ',' + c.y] = {
            P: P,
            R: b.inner ? { x: lerp(P.x, b.inner.x, t), y: lerp(P.y, b.inner.y, t) } : null,
            orig: b.inner ? [{ x: c.x, y: c.y }, { x: b.inner.x, y: b.inner.y }] : null,
            t: t
          };
        }
      });
      var lines = {};
      pts.forEach(function (p) { (lines[p.line_no] = lines[p.line_no] || []).push(p); });
      var out = [], best = null;
      Object.keys(lines).forEach(function (k) {
        var orig = lines[k].map(function (p) { return { x: p.x, y: p.y }; });
        var arr = orig.map(function (p) { return { x: p.x, y: p.y }; });
        var ext = null;
        var a0 = adj[arr[0].x + ',' + arr[0].y];
        if (a0) { arr[0] = a0.P; if (a0.R) ext = { pts: orthoRoute([a0.P, a0.R], a0.orig), opacity: a0.t }; }
        var a1 = adj[arr[arr.length - 1].x + ',' + arr[arr.length - 1].y];
        if (a1) { arr[arr.length - 1] = a1.P; if (a1.R) ext = { pts: orthoRoute([a1.P, a1.R], a1.orig), opacity: a1.t }; }
        if (orig.length > 1) {
          var h0 = Math.abs(orig[1].x - orig[0].x) >= Math.abs(orig[1].y - orig[0].y);
          var hL = Math.abs(orig[orig.length - 1].x - orig[orig.length - 2].x) >= Math.abs(orig[orig.length - 1].y - orig[orig.length - 2].y);
          arr = orthoRoute(arr, orig, exitAt(orig[0], h0), exitAt(orig[orig.length - 1], hL));
        } else {
          arr = orthoRoute(arr, orig);
        }
        out.push({ pts: arr, ext: ext, line_no: +k });
        for (var i = 1; i < arr.length; i++) {
          var dx = arr[i].x - arr[i - 1].x, dy = arr[i].y - arr[i - 1].y;
          var len = Math.sqrt(dx * dx + dy * dy);
          if (!best || len > best.len) best = { len: len, x: (arr[i].x + arr[i - 1].x) / 2, y: (arr[i].y + arr[i - 1].y) / 2, dx: dx, dy: dy };
        }
      });
      var label = null;
      if (best) {
        var w = l.name.length * 6;
        var cx1 = null, cx2 = null;
        if (l.parent_device_id) {
          var cd = devices[l.parent_device_id], cs2 = devSize(cd);
          cx1 = cd.x - cs2.w / 2; cx2 = cd.x + cs2.w / 2;
        }
        if (Math.abs(best.dx) >= Math.abs(best.dy)) {
          var y = best.len < 100 ? best.y - (DEV_H / 2 + 8) : best.y - 7;
          var x = best.x;
          if (cx1 != null) x = Math.max(cx1 + w / 2 + 4, Math.min(cx2 - w / 2 - 4, x));
          label = { name: l.name, x: x, y: y, anchor: 'middle', w: w, opacity: op };
        } else {
          var anchor = 'start', lx = best.x + 7;
          if (cx1 != null && lx + w > cx2 - 4) { anchor = 'end'; lx = best.x - 7; }
          label = { name: l.name, x: lx, y: best.y + 4, anchor: anchor, w: w, opacity: op };
        }
      }
      var cs = m.connectors.filter(function (c) { return c.link_id === l.id; });
      var res = l.resource_id ? resources[l.resource_id].name : 'не задан';
      var comp = l.parent_link_id ? ' Входит в состав Link: ' + links[l.parent_link_id].name + '.' : '';
      if (l.parent_device_id) comp += ' Входит в состав Device: ' + devices[l.parent_device_id].name + '.';
      var kids = m.links.filter(function (o) { return o.parent_link_id === l.id; });
      if (kids.length) comp += ' Составной Link, секций: ' + kids.length + '.';
      L.links.push({
        l: l, lines: out, label: label, opacity: op,
        desc: 'Пассивно передаёт ресурс без изменения его вида. Ресурс: ' + res + '. Коннекторов: ' + cs.length + '.' + comp
      });
      if (label) L.labels.push(label);
    });

    m.devices.forEach(function (d) {
      if (d.x == null || isComp(d)) return;
      var op = d.parent_device_id ? fadeInner(tOf(d.parent_device_id)) : 1;
      if (op < 0.01) return;
      var cs = m.connectors.filter(function (c) { return c.device_id === d.id; });
      var hs = m.holders.filter(function (h) { return h.device_id === d.id; });
      var parent = d.parent_device_id ? ' Входит в состав: ' + devices[d.parent_device_id].name + '.' : '';
      var s = devSize(d);
      L.devices.push({
        d: d, x: d.x - s.w / 2, y: d.y - s.h / 2, w: s.w, h: s.h, opacity: op,
        desc: 'Преобразует, накапливает, отдаёт или регулирует ресурс. Коннекторов: ' + cs.length + ', креплений: ' + hs.length + '.' + parent
      });
    });

    function portGroups(rows, posFn, opFn, kind, pairRows, aKey, bKey) {
      var groups = {};
      rows.forEach(function (c) {
        if (c.x == null) return;
        var op = opFn(c);
        if (op < 0.01) return;
        var p = posFn(c);
        var key = Math.round(p.x * 10) + ':' + Math.round(p.y * 10);
        var g = groups[key];
        if (!g) { g = groups[key] = { x: p.x, y: p.y, opacity: 0, members: [] }; }
        g.opacity = Math.max(g.opacity, op);
        g.members.push(c);
      });
      Object.keys(groups).forEach(function (key) {
        var g = groups[key];
        var names = g.members.map(function (o) { return o.name + ' (' + ownerName(o) + ')'; }).join('; ');
        var pairs = pairRows.filter(function (p) {
          return g.members.some(function (o) { return o.id === p[aKey] || o.id === p[bKey]; });
        }).map(function (p) {
          var otherId = g.members.some(function (o) { return o.id === p[aKey]; }) ? p[bKey] : p[aKey];
          var other = connectors[otherId] || holders[otherId];
          return other ? other.name + ' (' + ownerName(other) + ')' : '—';
        });
        var res = g.members[0].resource_id && resources[g.members[0].resource_id] ? ' Ресурс: ' + resources[g.members[0].resource_id].name + '.' : '';
        var od = null, of = null;
        g.members.forEach(function (o) { if (o.device_id) od = o.device_id; if (o.frame_id) of = o.frame_id; });
        L.ports.push({
          kind: kind, x: g.x, y: g.y, opacity: g.opacity,
          pdev: od, pframe: od ? null : of,
          name: g.members.map(function (o) { return o.name; }).join(' ↔ '),
          desc: names + '.' + (pairs.length ? ' Связан с: ' + pairs.join('; ') + '.' : '') + res
        });
      });
    }
    portGroups(m.connectors, connPos, connOpacity, 'conn', m.connections, 'connector_a_id', 'connector_b_id');
    portGroups(m.holders, holdPos, holdOpacity, 'hold', m.bindings, 'holder_a_id', 'holder_b_id');

    // Подписи линков не накладываем друг на друга: сдвигаем по вертикали.
    var placed = [];
    L.labels.forEach(function (t) {
      var x1 = t.anchor === 'middle' ? t.x - t.w / 2 : t.anchor === 'end' ? t.x - t.w : t.x;
      var box = { x1: x1, x2: x1 + t.w, y1: t.y - 11, y2: t.y + 3 };
      [0, -14, 14, -28, 28, -42, 42].some(function (dy) {
        var b = { x1: box.x1, x2: box.x2, y1: box.y1 + dy, y2: box.y2 + dy };
        var hit = placed.some(function (p) { return b.x1 < p.x2 && p.x1 < b.x2 && b.y1 < p.y2 && p.y1 < b.y2; });
        if (!hit) { box = b; t.y += dy; }
        return !hit;
      });
      placed.push(box);
    });

    return L;
  }

  function bounds(L) {
    var xs = [], ys = [];
    L.containers.forEach(function (c) { xs.push(c.x, c.x + c.w); ys.push(c.y, c.y + c.h); });
    L.devices.forEach(function (d) { xs.push(d.x, d.x + d.w); ys.push(d.y, d.y + d.h); });
    L.frames.forEach(function (f) { xs.push(f.x1, f.x2); ys.push(f.y1, f.labelY + 4); });
    L.links.forEach(function (l) {
      l.lines.forEach(function (ln) {
        ln.pts.forEach(function (p) { xs.push(p.x); ys.push(p.y); });
        if (ln.ext) ln.ext.pts.forEach(function (p) { xs.push(p.x); ys.push(p.y); });
      });
    });
    L.ports.forEach(function (p) { xs.push(p.x - 8, p.x + 8); ys.push(p.y - 8, p.y + 8); });
    L.labels.forEach(function (t) {
      if (t.anchor === 'middle') xs.push(t.x - t.w / 2, t.x + t.w / 2);
      else if (t.anchor === 'end') xs.push(t.x - t.w, t.x);
      else xs.push(t.x, t.x + t.w);
      ys.push(t.y - 11, t.y);
    });
    return {
      x1: Math.min.apply(null, xs) - 30, x2: Math.max.apply(null, xs) + 30,
      y1: Math.min.apply(null, ys) - 30, y2: Math.max.apply(null, ys) + 10
    };
  }

  function render() {
    var m = model;
    var scene = document.getElementById('scene');
    scene.innerHTML = '';
    segRoutes = {};
    var L = buildLayout(anim);
    var allOnes = {};
    m.devices.forEach(function (d) {
      if (m.devices.some(function (o) { return o.parent_device_id === d.id; })) allOnes[d.id] = 1;
    });
    var bC = bounds(buildLayout({})), bE = bounds(buildLayout(allOnes));
    var maxT = 0;
    Object.keys(anim).forEach(function (k) { maxT = Math.max(maxT, anim[k]); });
    var vb = {
      x1: lerp(bC.x1, bE.x1, maxT), x2: lerp(bC.x2, bE.x2, maxT),
      y1: lerp(bC.y1, bE.y1, maxT), y2: lerp(bC.y2, bE.y2, maxT)
    };
    if (!world) {
      var M = 1000;
      world = { x1: vb.x1 - M, y1: vb.y1 - M, x2: vb.x2 + M, y2: vb.y2 + M };
    }
    var ww = world.x2 - world.x1, wh = world.y2 - world.y1;
    var svg = el('svg', {
      viewBox: world.x1 + ' ' + world.y1 + ' ' + ww + ' ' + wh,
      width: ww * zoom, height: wh * zoom,
      role: 'img', 'aria-label': 'Мнемосхема системы'
    });
    scene.appendChild(svg);
    var defs = el('defs', {}, svg);
    var pat = el('pattern', { id: 'grid', width: gridStep, height: gridStep, patternUnits: 'userSpaceOnUse' }, defs);
    el('circle', { cx: 0, cy: 0, r: 1, fill: 'var(--grid)' }, pat);
    el('rect', { x: world.x1, y: world.y1, width: ww, height: wh, fill: 'url(#grid)', 'class': 'gridbg' }, svg);
    if (!centered) {
      centered = true;
      scene.scrollLeft = ((vb.x1 + vb.x2) / 2 - world.x1) * zoom - scene.clientWidth / 2;
      scene.scrollTop = ((vb.y1 + vb.y2) / 2 - world.y1) * zoom - scene.clientHeight / 2;
    }

    function select(g, kind, name, desc) {
      svg.querySelectorAll('.el').forEach(function (n) { n.classList.remove('sel'); });
      svg.querySelectorAll('text.llabel').forEach(function (n) { n.classList.remove('sel'); });
      if (!g) {
        svg.classList.remove('has-sel');
        return;
      }
      g.classList.add('sel');
      svg.classList.add('has-sel');
    }
    function clickable(g, kind, name, desc) {
      g.setAttribute('class', 'el');
      g.addEventListener('click', function () { select(g, kind, name, desc); });
    }
    function groupOpacity(g, op) { if (op < 1) g.setAttribute('opacity', op.toFixed(3)); }

    function drawFrame(f) {
      var g = el('g', { 'data-frame': f.f.id }, svg);
      groupOpacity(g, f.opacity);
      el('rect', { x: f.x1, y: f.y1, width: f.x2 - f.x1, height: f.y2 - f.y1, rx: 6, 'class': 'frame-rect' }, g);
      el('rect', { x: f.x1, y: f.y1, width: f.x2 - f.x1, height: f.y2 - f.y1, 'class': 'hit' }, g);
      txt(g, (f.x1 + f.x2) / 2, f.labelY, f.f.name, 'flabel');
      clickable(g, 'Frame', f.f.name, f.desc);
    }
    // Внешние Frame — под контейнерами и Device (просвечивают через заливку),
    // внутренние Frame составного Device — поверх фона контейнера, под его устройствами.
    L.frames.forEach(function (f) { if (!f.inner) drawFrame(f); });

    L.containers.forEach(function (c) {
      var g = el('g', { 'data-dev': c.d.id }, svg);
      el('rect', { x: c.x, y: c.y, width: c.w, height: c.h, rx: 4, 'class': 'dev' }, g);
      txt(g, c.d.x, c.nameY, c.d.name, 'dlabel');
      txt(g, c.d.x, c.subY, 'Device (составной)', 'sub dlabel');
      el('rect', { x: c.x, y: c.y, width: c.w, height: c.h, 'class': 'hit' }, g);
      clickable(g, 'Device', c.d.name, 'Преобразует, накапливает, отдаёт или регулирует ресурс. ' + c.desc);
      if (c.t > 0.5) el('rect', { x: c.x + c.w - 5, y: c.y + c.h - 5, width: 10, height: 10, 'class': 'rsz', 'data-rsz': c.d.id }, g);
    });

    L.frames.forEach(function (f) { if (f.inner) drawFrame(f); });

    L.links.forEach(function (l) {
      var g = el('g', {}, svg);
      groupOpacity(g, l.opacity);
      l.lines.forEach(function (ln) {
        var str = ln.pts.map(function (p) { return p.x + ',' + p.y; }).join(' ');
        el('polyline', { points: str, 'class': 'link' }, g);
        el('polyline', { points: str, 'class': 'hit' }, g);
        // Ручки сегментов: внутренние отрезки трассы (без защитных отходов у разъёмов).
        for (var j = 1; j < ln.pts.length - 2; j++) {
          var P = ln.pts[j], Q = ln.pts[j + 1];
          var horiz = P.y === Q.y, vert = P.x === Q.x;
          if (!horiz && !vert) continue;
          var lLast = ln.pts.length - 1;
          // сегмент, упёртый в коллинеарный защитный отход, поперёк не двигается
          if (j === 1 && (ln.pts[1].y === ln.pts[0].y) === horiz) continue;
          if (j + 1 === lLast - 1 && (ln.pts[lLast].y === ln.pts[lLast - 1].y) === horiz) continue;
          var span = horiz ? [Math.min(P.x, Q.x), Math.max(P.x, Q.x)] : [Math.min(P.y, Q.y), Math.max(P.y, Q.y)];
          el('line', { x1: P.x, y1: P.y, x2: Q.x, y2: Q.y, 'class': 'lseg ' + (horiz ? 'h' : 'v'),
            'data-link': l.l.id, 'data-line': ln.line_no, 'data-h': horiz ? 1 : 0,
            'data-span': span.join(',') }, g);
        }
        segRoutes[l.l.id + ':' + ln.line_no] = ln.pts;
        if (ln.ext && ln.ext.opacity > 0.01) {
          var es = ln.ext.pts.map(function (p) { return p.x + ',' + p.y; }).join(' ');
          var eg = el('g', { opacity: ln.ext.opacity.toFixed(3) }, g);
          el('polyline', { points: es, 'class': 'link' }, eg);
        }
      });
      g.setAttribute('class', 'el');
      g.addEventListener('click', function () {
        select(g, 'Link', l.l.name, l.desc);
        if (l.label && l.label.node) l.label.node.classList.add('sel');
      });
      if (l.label) { l.label.group = g; l.label.desc = l.desc; }
    });

    L.devices.forEach(function (d) {
      var g = el('g', { 'data-dev': d.d.id }, svg);
      groupOpacity(g, d.opacity);
      el('rect', { x: d.x, y: d.y, width: d.w, height: d.h, rx: 4, 'class': 'dev' }, g);
      txt(g, d.d.x, d.d.y - 3, d.d.name, 'dlabel');
      txt(g, d.d.x, d.d.y + 14, 'Device', 'sub dlabel');
      clickable(g, 'Device', d.d.name, d.desc);
      el('rect', { x: d.x + d.w - 5, y: d.y + d.h - 5, width: 10, height: 10, 'class': 'rsz', 'data-rsz': d.d.id }, g);
    });

    L.ports.forEach(function (p) {
      var g = el('g', {}, svg);
      if (p.pdev) g.setAttribute('data-pdev', p.pdev);
      if (p.pframe) g.setAttribute('data-pframe', p.pframe);
      groupOpacity(g, p.opacity);
      var r = p.kind === 'conn' ? 6 : 7;
      el('circle', { cx: p.x, cy: p.y, r: r, 'class': p.kind }, g);
      el('circle', { cx: p.x, cy: p.y, r: 16, 'class': 'hit' }, g);
      clickable(g, p.kind === 'conn' ? 'Connector' : 'Holder', p.name, p.desc);
    });

    L.labels.forEach(function (t) {
      var n = txt(svg, t.x, t.y, t.name, 'llabel');
      n.setAttribute('text-anchor', t.anchor);
      if (t.opacity < 1) n.setAttribute('opacity', t.opacity.toFixed(3));
      t.node = n;
      if (t.group) n.addEventListener('click', function (e) {
        e.stopPropagation();
        select(t.group, 'Link', t.name, t.desc);
        n.classList.add('sel');
      });
    });

    L.buttons.forEach(function (b) {
      var g = el('g', { 'class': 'xbtn' }, svg);
      el('rect', { x: b.x - 8, y: b.y - 8, width: 16, height: 16, rx: 3 }, g);
      el('line', { x1: b.x - 4, y1: b.y, x2: b.x + 4, y2: b.y }, g);
      if (b.t < 0.5) el('line', { x1: b.x, y1: b.y - 4, x2: b.x, y2: b.y + 4 }, g);
      var title = el('title', {}, g);
      title.textContent = b.t < 0.5 ? 'Развернуть внутреннюю схему' : 'Свернуть внутреннюю схему';
      g.addEventListener('click', function (e) { e.stopPropagation(); toggle(b.id); });
    });

    svg.addEventListener('click', function (e) {
      if (!e.target.closest('.el')) select(null);
    });
    deselect = function () { select(null); };
    select(null);
  }
})();
</script>
</body>
