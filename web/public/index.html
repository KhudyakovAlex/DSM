<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSM — мнемосхема</title>
<style>
  :root {
    color-scheme: dark;
    --fg: light-dark(#1a1a1a, #e8e8e8);
    --muted: light-dark(#6b7280, #9ca3af);
    --bg: light-dark(#ffffff, #16181d);
    --card: light-dark(#f6f7f9, #1f2229);
    --border: light-dark(#d7dae0, #3a3f4a);
    --dev-fill: light-dark(#eef1f5, #262a33);
    --dev: light-dark(#16a34a, #4ade80);
    --base-unit-fill: light-dark(#f3f4f6, #20232b);
    --link: light-dark(#2563eb, #60a5fa);
    --holder: light-dark(#d97706, #fbbf24);
    --accent: light-dark(#7c3aed, #a78bfa);
    --grid: light-dark(rgba(0,0,0,.25), rgba(255,255,255,.3));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 400 13px/1.45 system-ui, sans-serif;
         display: flex; flex-direction: column; }
  .topbar { display: flex; flex-direction: column; gap: 12px;
            padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  h1 { font-size: 14px; font-weight: 500; margin: 0; overflow-wrap: anywhere; }
  .field-nav { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  #back-btn { padding: 4px 10px; color: var(--fg); background: var(--card);
              border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  #back-btn[hidden] { display: none; }
  .field-boundary { pointer-events: none; }
  .workspace { display: flex; flex: 1; min-height: 0; gap: 12px; }
  #properties { flex: 0 0 260px; padding: 16px; overflow: auto; background: var(--card);
                border: 1px solid var(--border); border-radius: 8px; }
  #properties label[hidden] { display: none; }
  #property-empty { color: var(--muted); margin: 0; }
  #properties h2 { margin: 0 0 16px; font-size: 14px; }
  #properties label { display: block; margin-bottom: 14px; color: var(--muted); }
  #property-details input, #property-details select { display: block; width: 100%; margin-top: 6px;
    padding: 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; font: inherit; }
  #property-save { padding: 7px 12px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--accent); border-radius: 6px; cursor: pointer; font: inherit; }
  #property-save:disabled { opacity: .5; cursor: default; }
  #property-status { color: var(--muted); margin-top: 10px; overflow-wrap: anywhere; }
  #property-status.error { color: light-dark(#b91c1c, #f87171); }
  #scene { flex: 1; min-width: 0; min-height: 0; border-radius: 8px; overflow: auto; cursor: grab; }
  svg { display: block; touch-action: none; }
  body.editing g[data-dev] { cursor: grab; }
  body.editing g[data-base-unit] { cursor: grab; }
  #scene.panning { cursor: grabbing; }
  .gridbg { display: none; }
  body.editing .gridbg { display: block; }
  .tools { display: flex; align-items: center; gap: 6px; }
  #grid-step { width: 56px; height: 30px; padding: 0 6px; color: var(--fg);
               background: var(--card); border: 1px solid var(--border);
               border-radius: 6px; font: inherit; font-size: 12px; }
  #edit-btn, .zbtn { display: inline-flex; align-items: center; justify-content: center;
              width: 30px; height: 30px; padding: 0; color: var(--fg);
              background: var(--card); border: 1px solid var(--border);
              border-radius: 6px; cursor: pointer; }
  #edit-btn svg, .zbtn svg { width: 16px; height: 16px; }
  .zbtn { font: 500 16px/1 system-ui, sans-serif; }
  body.editing #edit-btn { border-color: var(--accent); color: var(--accent); }
  rect.dev { fill: var(--dev-fill); fill-opacity: .8; stroke: var(--dev); stroke-width: 1.5; }
  rect.base-unit-rect { fill: var(--base-unit-fill); stroke: var(--holder); stroke-width: 1.5; stroke-dasharray: 5 4; }
  polyline.link { stroke: var(--link); stroke-width: 2.5; fill: none; }
  circle.conn { fill: var(--link); }
  circle.hold { fill: none; stroke: var(--holder); stroke-width: 2; }
  text { fill: var(--fg); font-size: 13px; }
  text.sub, text.ulabel { font-size: 11px; }
  text.dlabel { fill: var(--dev); }
  text.ulabel { fill: var(--holder); }
  text.llabel { fill: var(--link); font-size: 11px; cursor: pointer;
                paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .hit { fill: transparent; stroke: none; }
  polyline.hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; }
  .el { cursor: pointer; }
  .xbtn { cursor: pointer; }
  .rsz { display: none; fill: var(--accent); stroke: var(--bg); stroke-width: 1; cursor: nwse-resize; }
  body.editing .rsz { display: block; }
  .lseg { stroke: transparent; stroke-width: 12; fill: none; pointer-events: stroke; }
  body.editing .lseg.h { cursor: row-resize; }
  body.editing .lseg.v { cursor: col-resize; }
  .xbtn rect { fill: var(--card); stroke: var(--dev); stroke-width: 1.5; }
  .xbtn line, .xbtn path { fill: none; stroke: var(--dev); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  svg.has-sel .el { opacity: .3; }
  svg.has-sel .el.sel { opacity: 1; }
  svg.has-sel text.llabel { opacity: .3; }
  svg.has-sel text.llabel.sel { opacity: 1; fill: var(--accent); }
  .el.sel rect.dev, .el.sel rect.base-unit-rect { stroke: var(--accent); stroke-width: 2.5; }
  .el.sel polyline.link { stroke: var(--accent); stroke-width: 3.5; }
  .el.sel circle.conn { fill: var(--accent); }
  .el.sel circle.hold { stroke: var(--accent); stroke-width: 3; }
  .el.sel text { fill: var(--accent); }
  #err, #save-status.error { color: light-dark(#b91c1c, #f87171); }
  #save-status { color: var(--muted); font-size: 12px; }
  #save-status:empty { display: none; }
  #save-retry { color: var(--fg); background: var(--card); border: 1px solid var(--border);
                border-radius: 6px; padding: 4px 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="workspace">
  <aside id="properties" aria-label="Управление схемой и параметры объекта">
    <header class="topbar">
      <div class="field-nav">
        <button id="back-btn" type="button" hidden>← Назад</button>
        <h1 id="field-title">DSM — мнемосхема системы (данные из PostgreSQL)</h1>
      </div>
      <div class="tools">
        <input id="grid-step" type="number" min="5" max="200" step="5" value="20" title="Шаг сетки (единицы модели)" aria-label="Шаг сетки">
        <button class="zbtn" id="zoom-out" type="button" title="Уменьшить масштаб" aria-label="Уменьшить масштаб">−</button>
        <button class="zbtn" id="zoom-in" type="button" title="Увеличить масштаб" aria-label="Увеличить масштаб">+</button>
        <button id="edit-btn" type="button" title="Редактировать схему" aria-label="Редактировать схему">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        </button>
      </div>
      <span id="save-status" role="status" aria-live="polite"></span>
      <button id="save-retry" type="button" hidden>Повторить сохранение</button>
    </header>
    <p id="property-empty">Выберите объект на схеме, чтобы изменить его параметры.</p>
    <section id="property-details" hidden>
      <h2 id="property-title">Параметры объекта</h2>
      <label id="property-member-field" hidden>Объект в контакте
        <select id="property-member"></select>
      </label>
      <form id="property-form">
        <label>Название<input id="property-name" name="name" required autocomplete="off"></label>
        <label id="property-resource-field" hidden>Ресурс<select id="property-resource" name="resource_id"></select></label>
        <button id="property-save" type="submit">Сохранить</button>
        <div id="property-status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </aside>
  <div id="scene"></div>
</div>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var DEV_W = 120, DEV_H = 50, UNIT_HALF = 30, UNIT_PAD = 14;

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function txt(parent, x, y, str, cls) {
    var t = el('text', { x: x, y: y, 'text-anchor': 'middle' }, parent);
    if (cls) t.setAttribute('class', cls);
    t.textContent = str;
    return t;
  }
  function byId(rows) {
    var m = {};
    rows.forEach(function (r) { m[r.id] = r; });
    return m;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  // Внутреннее содержимое составного Device показывается только во второй
  // половине раскрытия: иначе полноразмерные подписи и объекты налезают
  // на ещё маленький контейнер при сворачивании/раскрытии.
  function fadeInner(t) { return t <= 0.5 ? 0 : (2 * t - 1) * (2 * t - 1); }

  // Ортогональная перестройка трассы: концы могли сместиться (проекция портов
  // на границу свёрнутого Device), ориентации сегментов берутся из хранимой трассы.
  // ex0/exL — ось и знак отхода от края Device ({a:'h'|'v', s}) либо строка
  // оси для стыков без устройства: линк сначала отходит прямым участком по
  // нормали к грани, изгибы только после отхода.
  function orthoRoute(pts, orig, ex0, exL) {
    var n = pts.length;
    if (n < 2) return pts.slice();
    var e0 = ex0 ? (typeof ex0 === 'string' ? { h: ex0 === 'h', s: 0 } : { h: ex0.a === 'h', s: ex0.s }) : null;
    var eL = exL ? (typeof exL === 'string' ? { h: exL === 'h', s: 0 } : { h: exL.a === 'h', s: exL.s }) : null;
    var orient = [];
    for (var i = 0; i < n - 1; i++) {
      orient.push(Math.abs(orig[i + 1].x - orig[i].x) >= Math.abs(orig[i + 1].y - orig[i].y));
    }
    var h0 = e0 ? e0.h : orient[0];
    var hL = eL ? eL.h : orient[n - 2];
    // Два параллельных отхода на разных осях и одна средняя вершина: угол не
    // может лежать сразу на обеих осях — разворачиваем среднюю вершину в
    // перемычку (Z), иначе проекция даёт возвратный хвост.
    if (n === 3 && h0 === hL && (h0 ? pts[0].y !== pts[2].y : pts[0].x !== pts[2].x)) {
      var mid = pts[1];
      pts = h0
        ? [pts[0], { x: mid.x, y: pts[0].y }, { x: mid.x, y: pts[2].y }, pts[2]]
        : [pts[0], { x: pts[0].x, y: mid.y }, { x: pts[2].x, y: mid.y }, pts[2]];
      orient = [h0, !h0, h0];
      n = 4;
    }
    if (n > 2) {
      if (e0) { if (e0.h) pts[1].y = pts[0].y; else pts[1].x = pts[0].x; }
      if (eL) { if (eL.h) pts[n - 2].y = pts[n - 1].y; else pts[n - 2].x = pts[n - 1].x; }
    }
    if (e0) orient[0] = h0;
    if (eL) orient[n - 2] = hL;
    var pp = pts;
    if (e0 || eL) {
      var STUB = 25, a = pts[0], b = pts[n - 1];
      // Отход не длиннее примыкающего сегмента, иначе на коротких линках
      // отходы двух концов перекрываются и дают возвратный хвост.
      var half = n === 2 ? Math.sqrt((b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y)) / 2 : Infinity;
      var S0 = Math.min(STUB, half, Math.abs(h0 ? pts[1].x - a.x : pts[1].y - a.y));
      var SL = Math.min(STUB, half, Math.abs(hL ? pts[n - 2].x - b.x : pts[n - 2].y - b.y));
      // Параллельные отходы на косом коротком линке: сумма отходов не длиннее
      // расстояния между концами вдоль их оси, иначе средний сегмент идёт назад.
      if (n === 2 && h0 === hL) {
        var span = Math.abs(h0 ? b.x - a.x : b.y - a.y) / 2;
        S0 = Math.min(S0, span); SL = Math.min(SL, span);
      }
      // Знак отхода: у Device — наружу грани; у стыка — по фактическому
      // направлению первого сегмента трассы, а не «к дальнему концу»:
      // иначе отход смотрит против хода трассы и даёт хвост.
      var d0 = h0 ? pts[1].x - a.x : pts[1].y - a.y;
      var dL = hL ? pts[n - 2].x - b.x : pts[n - 2].y - b.y;
      var s0 = e0 && e0.s ? e0.s : (d0 ? (d0 > 0 ? 1 : -1) : (h0 ? (b.x >= a.x ? 1 : -1) : (b.y >= a.y ? 1 : -1)));
      var sL = eL && eL.s ? eL.s : (dL ? (dL > 0 ? 1 : -1) : (hL ? (a.x >= b.x ? 1 : -1) : (a.y >= b.y ? 1 : -1)));
      var A = { x: a.x + (h0 ? s0 * S0 : 0), y: a.y + (h0 ? 0 : s0 * S0) };
      var B = { x: b.x + (hL ? sL * SL : 0), y: b.y + (hL ? 0 : sL * SL) };
      pp = [a, A].concat(pts.slice(1, n - 1), [B, b]);
      orient = [h0].concat(orient, [hL]);
    }
    var m = pp.length;
    var out = [pp[0]];
    for (var i = 1; i < m - 1; i++) {
      out.push(orient[i - 1] ? { x: pp[i].x, y: out[i - 1].y } : { x: out[i - 1].x, y: pp[i].y });
    }
    var a2 = out[out.length - 1], b2 = pp[m - 1];
    if (a2.x !== b2.x && a2.y !== b2.y) {
      if (m === 2) {
        if (orient[0]) {
          var mx = (a2.x + b2.x) / 2;
          out.push({ x: mx, y: a2.y }, { x: mx, y: b2.y });
        } else {
          var my = (a2.y + b2.y) / 2;
          out.push({ x: a2.x, y: my }, { x: b2.x, y: my });
        }
      } else if (orient[m - 2]) out.push({ x: a2.x, y: b2.y });
      else out.push({ x: b2.x, y: a2.y });
    }
    out.push(b2);
    out = out.filter(function (p, i) { return i === 0 || p.x !== out[i - 1].x || p.y !== out[i - 1].y; });
    // Возвратные хвосты (вниз-вверх по одной линии) не рисуются: средняя
    // вершина шипа удаляется, трасса остаётся ортогональной и связной.
    for (var g = 0; g < 60; g++) {
      var cut = -1;
      for (var i = 1; i < out.length - 1; i++) {
        var pa = out[i - 1], pb = out[i], pc = out[i + 1];
        var coll = (pa.x === pb.x && pb.x === pc.x) || (pa.y === pb.y && pb.y === pc.y);
        if (coll && ((pb.x - pa.x) * (pc.x - pb.x) + (pb.y - pa.y) * (pc.y - pb.y)) < 0) { cut = i; break; }
      }
      if (cut < 0) break;
      out.splice(cut, 1);
    }
    return out;
  }

  var model = null, placementModel = null, anim = {}, raf = null, deselect = function () {};
  var focusId = null, fieldStack = [];
  var savedPlacements = {}, saving = false;
  var selected = null, propertySaving = false;
  var propertyName = document.getElementById('property-name');
  var propertyResource = document.getElementById('property-resource');
  var propertyStatus = document.getElementById('property-status');
  var propertyMember = document.getElementById('property-member');

  function entityDescription(type) {
    return {
      unit: 'Unit — материальная сущность с креплениями Holder. Базовый Unit не является Component и не имеет Connector.',
      device: 'Device → Component → Unit. Component — инженерный компонент с Connector; Holder наследуется от Unit. Device генерирует, преобразует, накапливает, коммутирует или регулирует ресурс, не наследуя пассивную передачу Link.',
      link: 'Link → Component → Unit. Component — инженерный компонент с Connector; Holder наследуется от Unit. Link пассивно передаёт ресурс без изменения его вида.',
      connector: 'Connector — разъём инженерного компонента (Component): Device или Link.',
      holder: 'Holder — крепление материальной сущности (Unit): базового Unit, Device или Link.'
    }[type];
  }

  function showProperties(type, rows, id) {
    selected = { type: type, id: id || rows[0].id };
    var row = byId(entityRows(placementModel, type))[selected.id];
    document.getElementById('property-details').hidden = false;
    document.getElementById('property-empty').hidden = true;
    document.getElementById('property-title').textContent = type.charAt(0).toUpperCase() + type.slice(1);
    document.getElementById('property-title').title = entityDescription(type);
    document.getElementById('property-member-field').hidden = rows.length < 2;
    propertyMember.replaceChildren();
    rows.forEach(function (r) {
      var option = document.createElement('option');
      option.value = r.id;
      option.textContent = r.name;
      propertyMember.appendChild(option);
    });
    propertyMember.value = selected.id;
    propertyName.value = row.name;
    propertyName.setCustomValidity('');
    document.getElementById('property-resource-field').hidden = type !== 'link';
    propertyResource.replaceChildren();
    [{ id: '', name: 'Не задан' }].concat(placementModel.resources).forEach(function (r) {
      var option = document.createElement('option');
      option.value = r.id;
      option.textContent = r.name;
      propertyResource.appendChild(option);
    });
    propertyResource.value = row.resource_id || '';
    propertyStatus.textContent = '';
    propertyStatus.classList.remove('error');
  }

  propertyMember.addEventListener('change', function () {
    var rows = Array.from(this.options).map(function (option) {
      return byId(entityRows(placementModel, selected.type))[option.value];
    });
    showProperties(selected.type, rows, Number(this.value));
  });
  propertyName.addEventListener('input', function () { this.setCustomValidity(''); });
  document.getElementById('property-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!selected || propertySaving) return;
    var name = propertyName.value.trim();
    if (!name) {
      propertyName.setCustomValidity('Введите название');
      propertyName.reportValidity();
      return;
    }
    var target = selected;
    var body = { name: name };
    if (target.type === 'link') body.resource_id = propertyResource.value ? Number(propertyResource.value) : null;
    propertySaving = true;
    propertyName.disabled = propertyResource.disabled = true;
    document.getElementById('property-save').disabled = true;
    propertyStatus.classList.remove('error');
    propertyStatus.textContent = 'Сохранение…';
    try {
      var response = await fetch('/api/entities/' + target.type + '/' + target.id, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      var result = await response.json();
      if (!response.ok) throw new Error(result.error || 'HTTP ' + response.status);
      [placementModel, model].forEach(function (m) {
        var row = byId(entityRows(m, target.type))[target.id];
        if (!row) return;
        row.name = result.name;
        if (target.type === 'link') row.resource_id = result.resource_id;
      });
      render();
      if (selected === target) {
        propertyName.value = result.name;
        propertyMember.selectedOptions[0].textContent = result.name;
        propertyStatus.textContent = 'Сохранено';
      }
    } catch (err) {
      if (selected === target) {
        propertyStatus.textContent = 'Не сохранено: ' + err.message;
        propertyStatus.classList.add('error');
      }
    } finally {
      propertySaving = false;
      propertyName.disabled = propertyResource.disabled = false;
      document.getElementById('property-save').disabled = false;
    }
  });

  function placementSnapshot() {
    return ['unit', 'connector', 'holder'].flatMap(function (type) {
      return placementModel[type + 's'].map(function (row) {
        var geom;
        if (type === 'unit' && row.kind === 'link') {
          var lines = {};
          placementModel.linkPoints.forEach(function (p) {
            if (p.link_id !== row.id) return;
            if (!lines[p.line_no]) lines[p.line_no] = [];
            lines[p.line_no].push(p);
          });
          geom = { lines: Object.keys(lines).sort(function (a, b) { return a - b; }).map(function (line) {
            return { line_no: +line, points: lines[line].sort(function (a, b) { return a.ord - b.ord; })
              .map(function (p) { return [p.x, p.y]; }) };
          }) };
        } else {
          geom = { x: row.x, y: row.y };
          var keys = type !== 'unit' ? [] : row.kind === 'device' ? ['w', 'h'] : ['base_y'];
          keys.forEach(function (key) { if (row[key] != null) geom[key] = row[key]; });
        }
        return { entity_type: type, entity_id: row.id, geom: geom };
      });
    });
  }

  function changedPlacements() {
    return placementSnapshot().filter(function (p) {
      return savedPlacements[p.entity_type + ':' + p.entity_id] !== JSON.stringify(p.geom);
    });
  }

  function saveStatus(text, error) {
    var status = document.getElementById('save-status');
    status.textContent = text;
    status.title = error || '';
    status.classList.toggle('error', !!error);
    document.getElementById('save-retry').hidden = !error;
  }

  function saveToDatabase() {
    if (!placementModel || saving) return;
    if (drag && drag.kind !== 'pan') { saveStatus('Не сохранено'); return; }
    var placements = changedPlacements();
    if (!placements.length) { saveStatus('Сохранено'); return; }
    saving = true;
    saveStatus('Сохранение…');
    fetch('/api/placements', {

      if (o && isComposite(o)) {
        var t = tOf(o.id);
        var cx = Math.max(o.x - DEV_W / 2, Math.min(o.x + DEV_W / 2, h.x));
        return { x: lerp(cx, h.x, t), y: lerp(o.y + DEV_H / 2, h.y, t) };
      }
      return { x: h.x, y: h.y };
    }

    // Граничные коннекторы составных Device и их связи с внешними линками.
    var boundary = {}, bcHasInner = {};
    Object.keys(compositeDeviceIds).forEach(function (cid) {
      var cd = devices[cid];
      if (cd.id === focusId) return;
      m.connectors.filter(function (c) { return c.component_id === cd.id; }).forEach(function (bc) {
        var partners = m.connections.filter(function (p) {
          return p.connector_a_id === bc.id || p.connector_b_id === bc.id;
        }).map(function (p) {
          return connectors[p.connector_a_id === bc.id ? p.connector_b_id : p.connector_a_id];
        });
        var inner = partners.filter(function (p) {
          return ownerKind(p, 'device') && devices[p.component_id].parent_id === cd.id;
        });
        bcHasInner[bc.id] = inner.length > 0;
        partners.filter(function (p) { return ownerKind(p, 'link'); }).forEach(function (ec) {
          boundary[ec.id] = { bc: bc, inner: inner[0] || null, cd: cd };
        });
      });
    });

    function connOpacity(c) {
      if (ownerKind(c, 'link')) {
        var l = links[c.component_id];
        var parent = deviceParent(l, model.unitIndex);
        if (parent) return innerOpacity(parent);
        var b = boundary[c.id];
        if (b && b.inner) return 1 - tOf(b.cd.id);
        return 1;
      }
      var o = devices[c.component_id];
      if (o.parent_id) return innerOpacity(o.parent_id);
      if (o.id === focusId) return 1;
      if (isComposite(o) && bcHasInner[c.id]) return (1 - tOf(o.id)) * innerOpacity(o.parent_id);
      return 1;
    }
    function holdOpacity(h) {
      return innerOpacity(deviceParent(units[h.unit_id], units));
    }
    function baseUnitGeom(f) {
      var hs = m.holders.filter(function (h) { return h.unit_id === f.id && h.x != null; });
      var x1, x2, y1, y2;
      if (hs.length) {
        var ps = hs.map(holdPos);
        x1 = Math.min.apply(null, ps.map(function (p) { return p.x; })) - UNIT_PAD;
        x2 = Math.max.apply(null, ps.map(function (p) { return p.x; })) + UNIT_PAD;
        y1 = Math.min.apply(null, ps.map(function (p) { return p.y; })) - UNIT_PAD;
        y2 = Math.max.apply(null, ps.map(function (p) { return p.y; })) + UNIT_PAD;
      } else {
        x1 = f.x - UNIT_HALF; x2 = f.x + UNIT_HALF;
        y1 = f.y; y2 = f.base_y != null ? f.base_y : f.y + 2 * UNIT_HALF;
      }
      // Подпись Unit — внутри, у нижней границы: прямоугольник охватывает
      // холдеры и строку подписи.
      var fw = f.name.length * 6, cx = (x1 + x2) / 2;
      y2 += 16;
      x1 = Math.min(x1, cx - fw / 2 - 6);
      x2 = Math.max(x2, cx + fw / 2 + 6);
      return { x1: x1, x2: x2, y1: y1, y2: y2, labelY: y2 - 5 };
    }
    // Ось и направление отхода от края Device: нормаль к грани, наружу.
    function exitAt(pt, fb, lid) {
      var c = null;
      m.connectors.forEach(function (cc) { if (ownerKind(cc, 'device') && cc.x === pt.x && cc.y === pt.y) c = cc; });
      if (!c) return fb ? 'h' : 'v';
      var d = devices[c.component_id], s = devSize(d);
      var horiz = Math.abs(pt.x - d.x) / (s.w / 2) >= Math.abs(pt.y - d.y) / (s.h / 2);
      var sg = horiz ? (pt.x >= d.x ? 1 : -1) : (pt.y >= d.y ? 1 : -1);
      var inside = d.id === focusId || (lid && deviceParent(links[lid], model.unitIndex) === d.id);
      return { a: horiz ? 'h' : 'v', s: inside ? -sg : sg };
    }
    function ownerName(port) {
      var owner = units[ownerId(port)];
      return owner ? owner.name : '—';
    }
    function compositeDeviceDesc(d) {
      var nd = m.devices.filter(function (o) { return o.parent_id === d.id; }).length;
      var nl = m.links.filter(function (o) { return o.parent_id === d.id; }).length;
      var nu = m.baseUnits.filter(function (o) { return o.parent_id === d.id; }).length;
      return entityDescription('device') + ' Составной Device: внутренняя схема — устройств: ' + nd + ', линков: ' + nl + ', базовых Unit: ' + nu + '.';
    }

    var L = { containers: [], baseUnits: [], links: [], devices: [], ports: [], labels: [], buttons: [], contacts: [] };
    if (focusId != null) m.connections.forEach(function (p) {
      var a = connectors[p.connector_a_id], b = connectors[p.connector_b_id];
      if (b.component_id === focusId) { var swap = a; a = b; b = swap; }
      if (a.component_id !== focusId || !ownerKind(b, 'device') || b.component_id === focusId) return;
      var pts = [connPos(a), connPos(b)];
      L.contacts.push(orthoRoute(pts, pts, exitAt(pts[0], true), exitAt(pts[1], true)));
    });

    m.devices.forEach(function (d) {
      if (d.x == null || !isComposite(d)) return;
      var op = innerOpacity(d.parent_id);
      if (op < 0.01) return;
      var s = devSize(d);
      L.containers.push({
        d: d, x: d.x - s.w / 2, y: d.y - s.h / 2, w: s.w, h: s.h, t: s.t,
        nameY: lerp(d.y - 3, d.y - s.h / 2 + 18, s.t),
        subY: lerp(d.y + 14, d.y - s.h / 2 + 33, s.t),
        desc: compositeDeviceDesc(d), opacity: op
      });
      if (d.id !== focusId) L.buttons.push({ id: d.id, x: d.x + s.w / 2 - 14, y: d.y - s.h / 2 + 14, t: s.t, opacity: op });
    });

    m.baseUnits.forEach(function (f) {
      if (f.x == null) return;
      var op = innerOpacity(deviceParent(f, model.unitIndex));
      if (op < 0.01) return;
      var gm = baseUnitGeom(f);
      var hs = m.holders.filter(function (h) { return h.unit_id === f.id; });
      L.baseUnits.push({
        f: f, x1: gm.x1, y1: gm.y1, x2: gm.x2, y2: gm.y2, labelY: gm.labelY, opacity: op,
        inner: !!deviceParent(f, model.unitIndex),
        desc: entityDescription('unit') + ' Креплений (Holder): ' + hs.length + '.'
      });
    });

    m.links.forEach(function (l) {
      var pts = m.linkPoints.filter(function (p) { return p.link_id === l.id; });
      if (!pts.length) return;
      var op = innerOpacity(deviceParent(l, model.unitIndex));
      if (op < 0.01) return;
      var adj = {};
      m.connectors.forEach(function (c) {
        if (c.component_id === l.id && boundary[c.id]) {
          var b = boundary[c.id], P = connPos(b.bc), t = tOf(b.cd.id);
          adj[c.x + ',' + c.y] = {
            P: P,
            R: b.inner ? { x: lerp(P.x, b.inner.x, t), y: lerp(P.y, b.inner.y, t) } : null,
            orig: b.inner ? [{ x: c.x, y: c.y }, { x: b.inner.x, y: b.inner.y }] : null,
            t: t
          };
        }
      });
      var lines = {};
      pts.forEach(function (p) { (lines[p.line_no] = lines[p.line_no] || []).push(p); });
      var out = [], best = null;
      Object.keys(lines).forEach(function (k) {
        var orig = lines[k].map(function (p) { return { x: p.x, y: p.y }; });
        var arr = orig.map(function (p) { return { x: p.x, y: p.y }; });
        var ext = null;
        var a0 = adj[arr[0].x + ',' + arr[0].y];
        if (a0) { arr[0] = a0.P; if (a0.R) ext = { pts: orthoRoute([a0.P, a0.R], a0.orig), opacity: a0.t }; }
        var a1 = adj[arr[arr.length - 1].x + ',' + arr[arr.length - 1].y];
        if (a1) { arr[arr.length - 1] = a1.P; if (a1.R) ext = { pts: orthoRoute([a1.P, a1.R], a1.orig), opacity: a1.t }; }
        if (orig.length > 1) {
          var h0 = Math.abs(orig[1].x - orig[0].x) >= Math.abs(orig[1].y - orig[0].y);
          var hL = Math.abs(orig[orig.length - 1].x - orig[orig.length - 2].x) >= Math.abs(orig[orig.length - 1].y - orig[orig.length - 2].y);
          arr = orthoRoute(arr, orig, exitAt(orig[0], h0, l.id), exitAt(orig[orig.length - 1], hL, l.id));
        } else {
          arr = orthoRoute(arr, orig);
        }
        var clean = [];
        arr.forEach(function (p) {
          var prev = clean[clean.length - 1];
          if (!prev || prev.x !== p.x || prev.y !== p.y) clean.push(p);
        });
        arr = clean;
        out.push({ pts: arr, ext: ext, line_no: +k });
        for (var i = 1; i < arr.length; i++) {
          var dx = arr[i].x - arr[i - 1].x, dy = arr[i].y - arr[i - 1].y;
          var len = Math.sqrt(dx * dx + dy * dy);
          if (!best || len > best.len) best = { len: len, x: (arr[i].x + arr[i - 1].x) / 2, y: (arr[i].y + arr[i - 1].y) / 2, dx: dx, dy: dy };
        }
      });
      var res = l.resource_id ? resources[l.resource_id].name : 'не задан';
      var label = null;
      if (best) {
        var w = Math.max(l.name.length, res.length) * 6;
        var cx1 = null, cx2 = null;
        var parentDeviceId = deviceParent(l, units);
        if (parentDeviceId != null) {
          var cd = devices[parentDeviceId], cs2 = devSize(cd);
          cx1 = cd.x - cs2.w / 2; cx2 = cd.x + cs2.w / 2;
        }
        if (Math.abs(best.dx) >= Math.abs(best.dy)) {
          var y = (best.len < 100 ? best.y - (DEV_H / 2 + 8) : best.y - 7) - 14;
          var x = best.x;
          if (cx1 != null) x = Math.max(cx1 + w / 2 + 4, Math.min(cx2 - w / 2 - 4, x));
          label = { name: l.name, x: x, y: y, anchor: 'middle', w: w, opacity: op };
        } else {
          var anchor = 'start', lx = best.x + 7;
          if (cx1 != null && lx + w > cx2 - 4) { anchor = 'end'; lx = best.x - 7; }
          label = { name: l.name, x: lx, y: best.y - 3, anchor: anchor, w: w, opacity: op };
        }
        label.resource = res;
      }
      var cs = m.connectors.filter(function (c) { return c.component_id === l.id; });
      var parentUnit = units[l.parent_id];
      var composition = parentUnit ? ' Входит в состав ' + (parentUnit.kind === 'link' ? 'Link' : 'Device') + ': ' + parentUnit.name + '.' : '';
      var kids = m.links.filter(function (o) { return o.parent_id === l.id; });
      if (kids.length) composition += ' Составной Link, секций: ' + kids.length + '.';
      L.links.push({
        l: l, lines: out, label: label, opacity: op,
        desc: entityDescription('link') + ' Ресурс: ' + res + '. Коннекторов: ' + cs.length + '.' + composition
      });
      if (label) L.labels.push(label);
    });

    m.devices.forEach(function (d) {
      if (d.x == null || isComposite(d)) return;
      var op = d.parent_id ? innerOpacity(d.parent_id) : 1;
      if (op < 0.01) return;
      var cs = m.connectors.filter(function (c) { return c.component_id === d.id; });
      var hs = m.holders.filter(function (h) { return h.unit_id === d.id; });
      var parent = d.parent_id ? ' Входит в состав: ' + devices[d.parent_id].name + '.' : '';
      var s = devSize(d);
      L.devices.push({
        d: d, x: d.x - s.w / 2, y: d.y - s.h / 2, w: s.w, h: s.h, opacity: op,
        desc: entityDescription('device') + ' Коннекторов: ' + cs.length + ', креплений: ' + hs.length + '.' + parent
      });
    });

    function portGroups(rows, posFn, opFn, kind, pairRows, aKey, bKey) {
      var groups = {};
      rows.forEach(function (c) {
        if (c.x == null) return;
        var op = opFn(c);
        if (op < 0.01) return;
        var p = posFn(c);
        var key = Math.round(p.x * 10) + ':' + Math.round(p.y * 10);
        var g = groups[key];
        if (!g) { g = groups[key] = { x: p.x, y: p.y, opacity: 0, members: [] }; }
        g.opacity = Math.max(g.opacity, op);
        g.members.push(c);
      });
      Object.keys(groups).forEach(function (key) {
        var g = groups[key];
        var names = g.members.map(function (o) { return o.name + ' (' + ownerName(o) + ')'; }).join('; ');
        var pairs = pairRows.filter(function (p) {
          return g.members.some(function (o) { return o.id === p[aKey] || o.id === p[bKey]; });
        }).map(function (p) {
          var otherId = g.members.some(function (o) { return o.id === p[aKey]; }) ? p[bKey] : p[aKey];
          var other = (kind === 'conn' ? connectors : holders)[otherId];
          return other ? other.name + ' (' + ownerName(other) + ')' : '—';
        });
        var res = g.members[0].resource_id && resources[g.members[0].resource_id] ? ' Ресурс: ' + resources[g.members[0].resource_id].name + '.' : '';
        var deviceId = null, baseUnitId = null;
        g.members.forEach(function (port) {
          var owner = units[ownerId(port)];
          if (owner.kind === 'device') deviceId = owner.id;
          if (owner.kind === 'unit') baseUnitId = owner.id;
        });
        L.ports.push({
          kind: kind, members: g.members, x: g.x, y: g.y, opacity: g.opacity,
          pdev: deviceId, pbaseUnit: deviceId != null ? null : baseUnitId,
          name: g.members.map(function (o) { return o.name; }).join(' ↔ '),
          desc: entityDescription(kind === 'conn' ? 'connector' : 'holder') + ' ' + names + '.' +
            (pairs.length ? ' Связан с: ' + pairs.join('; ') + '.' : '') + res
        });
      });
    }
    portGroups(m.connectors, connPos, connOpacity, 'conn', m.connections, 'connector_a_id', 'connector_b_id');
    portGroups(m.holders, holdPos, holdOpacity, 'hold', m.bindings, 'holder_a_id', 'holder_b_id');

    // Подписи линков не накладываем друг на друга: сдвигаем по вертикали.
    var placed = [];
    L.labels.forEach(function (t) {
      var x1 = t.anchor === 'middle' ? t.x - t.w / 2 : t.anchor === 'end' ? t.x - t.w : t.x;
      var box = { x1: x1, x2: x1 + t.w, y1: t.y - 11, y2: t.y + 17 };
      [0, -28, 28, -56, 56, -84, 84].some(function (dy) {
        var b = { x1: box.x1, x2: box.x2, y1: box.y1 + dy, y2: box.y2 + dy };
        var hit = placed.some(function (p) { return b.x1 < p.x2 && p.x1 < b.x2 && b.y1 < p.y2 && p.y1 < b.y2; });
        if (!hit) { box = b; t.y += dy; }
        return !hit;
      });
      placed.push(box);
    });

    return L;
  }

  function bounds(L) {
    var xs = [], ys = [];
    L.containers.forEach(function (c) { xs.push(c.x, c.x + c.w); ys.push(c.y, c.y + c.h); });
    L.devices.forEach(function (d) { xs.push(d.x, d.x + d.w); ys.push(d.y, d.y + d.h); });
    L.baseUnits.forEach(function (f) { xs.push(f.x1, f.x2); ys.push(f.y1, f.labelY + 4); });
    L.links.forEach(function (l) {
      l.lines.forEach(function (ln) {
        ln.pts.forEach(function (p) { xs.push(p.x); ys.push(p.y); });
        if (ln.ext) ln.ext.pts.forEach(function (p) { xs.push(p.x); ys.push(p.y); });
      });
    });
    L.ports.forEach(function (p) { xs.push(p.x - 8, p.x + 8); ys.push(p.y - 8, p.y + 8); });
    L.labels.forEach(function (t) {
      if (t.anchor === 'middle') xs.push(t.x - t.w / 2, t.x + t.w / 2);
      else if (t.anchor === 'end') xs.push(t.x - t.w, t.x);
      else xs.push(t.x, t.x + t.w);
      ys.push(t.y - 11, t.y + 17);
    });
    return {
      x1: Math.min.apply(null, xs) - 30, x2: Math.max.apply(null, xs) + 30,
      y1: Math.min.apply(null, ys) - 30, y2: Math.max.apply(null, ys) + 10
    };
  }

  function render() {
    var m = model;
    var scene = document.getElementById('scene');
    scene.innerHTML = '';
    document.getElementById('back-btn').hidden = focusId == null;
    var fieldTitle = focusId == null ? 'DSM — мнемосхема системы (данные из PostgreSQL)' : 'Внутренности составного устройства — ' + byId(m.devices)[focusId].name;
    document.getElementById('field-title').textContent = fieldTitle;
    scene.dataset.parentDevice = focusId == null ? '' : String(focusId);
    segRoutes = {};
    var L = buildLayout(anim);
    var vb = bounds(L);
    if (!world) {
      var M = 1000;
      world = { x1: vb.x1 - M, y1: vb.y1 - M, x2: vb.x2 + M, y2: vb.y2 + M };
    }
    var ww = world.x2 - world.x1, wh = world.y2 - world.y1;
    var svg = el('svg', {
      viewBox: world.x1 + ' ' + world.y1 + ' ' + ww + ' ' + wh,
      width: ww * zoom, height: wh * zoom,
      role: 'img', 'aria-label': fieldTitle
    });
    scene.appendChild(svg);
    var defs = el('defs', {}, svg);
    var pat = el('pattern', { id: 'grid', width: gridStep, height: gridStep, patternUnits: 'userSpaceOnUse' }, defs);
    el('circle', { cx: 0, cy: 0, r: 1.5, fill: 'var(--grid)' }, pat);
    el('rect', { x: world.x1, y: world.y1, width: ww, height: wh, fill: 'url(#grid)', 'class': 'gridbg' }, svg);
    if (!centered) {
      centered = true;
      scene.scrollLeft = ((vb.x1 + vb.x2) / 2 - world.x1) * zoom - scene.clientWidth / 2;
      scene.scrollTop = ((vb.y1 + vb.y2) / 2 - world.y1) * zoom - scene.clientHeight / 2;
    }

    function highlight(g) {
      svg.querySelectorAll('.sel').forEach(function (n) { n.classList.remove('sel'); });
      svg.classList.toggle('has-sel', !!g);
      if (g) {
        g.classList.add('sel');
        L.labels.forEach(function (t) { if (t.group === g && t.node) t.node.classList.add('sel'); });
      }
    }
    function select(g) {
      highlight(g);
      if (!g) {
        selected = null;
        document.getElementById('property-details').hidden = true;
        document.getElementById('property-empty').hidden = false;
        return;
      }
      var type = g.dataset.entityType;
      var rows = g.dataset.entityIds.split(',').map(function (id) { return byId(entityRows(placementModel, type))[id]; });
      showProperties(type, rows);
    }
    function clickable(g, type, rows, description) {
      g.setAttribute('class', 'el');
      g.dataset.entityType = type;
      g.dataset.entityIds = rows.map(function (row) { return row.id; }).join(',');
      el('title', {}, g).textContent = rows.map(function (row) { return row.name; }).join(' ↔ ') + '\n' + (description || entityDescription(type));
      g.addEventListener('click', function () { select(g); });
    }
    function groupOpacity(g, op) { if (op < 1) g.setAttribute('opacity', op.toFixed(3)); }

    function drawBaseUnit(f) {
      var g = el('g', { 'data-base-unit': f.f.id }, svg);
      groupOpacity(g, f.opacity);
      el('rect', { x: f.x1, y: f.y1, width: f.x2 - f.x1, height: f.y2 - f.y1, rx: 6, 'class': 'base-unit-rect' }, g);
      el('rect', { x: f.x1, y: f.y1, width: f.x2 - f.x1, height: f.y2 - f.y1, 'class': 'hit' }, g);
      txt(g, (f.x1 + f.x2) / 2, f.labelY, f.f.name, 'ulabel');
      clickable(g, 'unit', [f.f], f.desc);
    }
    // Внутренние Unit рисуются поверх фона контейнера, внешние — под контейнерами.
    L.baseUnits.forEach(function (f) { if (!f.inner) drawBaseUnit(f); });

    L.containers.forEach(function (c) {
      var g = el('g', c.d.id === focusId ? { 'class': 'field-boundary' } : { 'data-dev': c.d.id }, svg);
      groupOpacity(g, c.opacity);
      el('rect', { x: c.x, y: c.y, width: c.w, height: c.h, rx: 4, 'class': 'dev' }, g);
      txt(g, c.d.x, c.nameY, c.d.name, 'dlabel');
      txt(g, c.d.x, c.subY, 'Device (составной)', 'sub dlabel');
      el('rect', { x: c.x, y: c.y, width: c.w, height: c.h, 'class': 'hit' }, g);
      if (c.d.id !== focusId) clickable(g, 'device', [c.d], c.desc);
      if (c.d.id !== focusId && c.t > 0.5) el('rect', { x: c.x + c.w - 5, y: c.y + c.h - 5, width: 10, height: 10, 'class': 'rsz', 'data-rsz': c.d.id }, g);
    });

    L.baseUnits.forEach(function (f) { if (f.inner) drawBaseUnit(f); });

    L.contacts.forEach(function (pts) {
      el('polyline', { points: pts.map(function (p) { return p.x + ',' + p.y; }).join(' '), 'class': 'link field-boundary' }, svg);
    });

    L.links.forEach(function (l) {
      var g = el('g', {}, svg);
      groupOpacity(g, l.opacity);
      l.lines.forEach(function (ln) {
        var str = ln.pts.map(function (p) { return p.x + ',' + p.y; }).join(' ');
        el('polyline', { points: str, 'class': 'link' }, g);
        el('polyline', { points: str, 'class': 'hit' }, g);
        // Ручки сегментов: внутренние отрезки трассы (без защитных отходов у разъёмов).
        for (var j = 1; j < ln.pts.length - 2; j++) {
          var P = ln.pts[j], Q = ln.pts[j + 1];
          var horiz = P.y === Q.y, vert = P.x === Q.x;
          if (!horiz && !vert) continue;
          var lLast = ln.pts.length - 1;
          // сегмент, упёртый в коллинеарный защитный отход, поперёк не двигается
          if (j === 1 && (ln.pts[1].y === ln.pts[0].y) === horiz) continue;
          if (j + 1 === lLast - 1 && (ln.pts[lLast].y === ln.pts[lLast - 1].y) === horiz) continue;
          var span = horiz ? [Math.min(P.x, Q.x), Math.max(P.x, Q.x)] : [Math.min(P.y, Q.y), Math.max(P.y, Q.y)];
          el('line', { x1: P.x, y1: P.y, x2: Q.x, y2: Q.y, 'class': 'lseg ' + (horiz ? 'h' : 'v'),
            'data-link': l.l.id, 'data-line': ln.line_no, 'data-h': horiz ? 1 : 0,
            'data-span': span.join(',') }, g);
        }
        segRoutes[l.l.id + ':' + ln.line_no] = ln.pts;
        if (ln.ext && ln.ext.opacity > 0.01) {
          var es = ln.ext.pts.map(function (p) { return p.x + ',' + p.y; }).join(' ');
          var eg = el('g', { opacity: ln.ext.opacity.toFixed(3) }, g);
          el('polyline', { points: es, 'class': 'link' }, eg);
        }
      });
      clickable(g, 'link', [l.l], l.desc);
      if (l.label) { l.label.group = g; l.label.desc = l.desc; }
    });

    L.devices.forEach(function (d) {
      var g = el('g', { 'data-dev': d.d.id }, svg);
      groupOpacity(g, d.opacity);
      el('rect', { x: d.x, y: d.y, width: d.w, height: d.h, rx: 4, 'class': 'dev' }, g);
      txt(g, d.d.x, d.d.y - 3, d.d.name, 'dlabel');
      txt(g, d.d.x, d.d.y + 14, 'Device', 'sub dlabel');
      clickable(g, 'device', [d.d], d.desc);
      el('rect', { x: d.x + d.w - 5, y: d.y + d.h - 5, width: 10, height: 10, 'class': 'rsz', 'data-rsz': d.d.id }, g);
    });

    L.ports.forEach(function (p) {
      var g = el('g', {}, svg);
      if (p.pdev) g.setAttribute('data-pdev', p.pdev);
      if (p.pbaseUnit) g.setAttribute('data-pbase-unit', p.pbaseUnit);
      groupOpacity(g, p.opacity);
      var r = p.kind === 'conn' ? 6 : 7;
      el('circle', { cx: p.x, cy: p.y, r: r, 'class': p.kind }, g);
      el('circle', { cx: p.x, cy: p.y, r: 16, 'class': 'hit' }, g);
      clickable(g, p.kind === 'conn' ? 'connector' : 'holder', p.members, p.desc);
    });

    L.labels.forEach(function (t) {
      var n = txt(svg, t.x, t.y, '', 'llabel');
      el('tspan', { x: t.x, dy: 0 }, n).textContent = t.name;
      el('tspan', { x: t.x, dy: 14 }, n).textContent = t.resource;
      n.setAttribute('text-anchor', t.anchor);
      if (t.opacity < 1) n.setAttribute('opacity', t.opacity.toFixed(3));
      t.node = n;
      el('title', {}, n).textContent = t.desc;
      if (t.group) n.addEventListener('click', function (e) {
        e.stopPropagation();
        select(t.group);
        n.classList.add('sel');
      });
    });

    if (focusId != null) {
      var root = byId(m.devices)[focusId];
      el('rect', { x: root.x + (root.w || DEV_W) / 2 - 5, y: root.y + (root.h || DEV_H) / 2 - 5,
        width: 10, height: 10, 'class': 'rsz', 'data-rsz': root.id }, svg);
    }

    L.buttons.forEach(function (b) {
      var label = editMode ? 'Редактировать внутреннюю схему' : b.t < 0.5 ? 'Развернуть внутреннюю схему' : 'Свернуть внутреннюю схему';
      var g = el('g', { 'class': 'xbtn', 'data-device': b.id, role: 'button', tabindex: 0, 'aria-label': label }, svg);
      groupOpacity(g, b.opacity);
      el('rect', { x: b.x - 9, y: b.y - 9, width: 18, height: 18, rx: 3 }, g);
      if (editMode) {
        el('path', { d: 'M ' + (b.x + 2) + ' ' + (b.y - 5) + ' l 3 3 -7 7 -4 1 1 -4 z' }, g);
      } else {
        el('line', { x1: b.x - 4, y1: b.y, x2: b.x + 4, y2: b.y }, g);
        if (b.t < 0.5) el('line', { x1: b.x, y1: b.y - 4, x2: b.x, y2: b.y + 4 }, g);
      }
      el('title', {}, g).textContent = label;
      function activate(e) { e.stopPropagation(); if (editMode) openField(b.id); else toggle(b.id); }
      g.addEventListener('click', activate);
      g.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(e); }
      });
    });

    svg.addEventListener('click', function (e) {
      if (!e.target.closest('.el')) select(null);
    });
    deselect = function () { select(null); };
    var selectedGroup = selected && Array.from(svg.querySelectorAll('.el')).find(function (g) {
      return g.dataset.entityType === selected.type && g.dataset.entityIds.split(',').includes(String(selected.id));
    });
    if (selectedGroup) highlight(selectedGroup);
    else select(null);
  }
})();
</script>
</body>
</html>
