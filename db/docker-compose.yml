services:
  db:
    image: postgres:16-alpine
    container_name: dsm-db
    environment:
      POSTGRES_DB: dsm
      POSTGRES_USER: dsm
      POSTGRES_PASSWORD: dsm
    ports:
      - "5433:5432"
    volumes:
      - dsm_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsm -d dsm"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ../web
    container_name: dsm-web
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: dsm
      PGPASSWORD: dsm
      PGDATABASE: dsm
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dsm_pgdata: